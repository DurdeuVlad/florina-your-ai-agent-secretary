<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' ws://127.0.0.1:*"
    />
    <title>Florina</title>
    <link rel="stylesheet" href="tokens.css" />
    <style>
      body { height: 100vh; overflow: hidden; -webkit-user-select: none; }
      .card.sel { outline: 1px solid var(--accent); }
      .empty-big { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
      .empty-hint { color: var(--muted); font-size: 13px; }
      .icon { font-size: 13px; }
      .group-items { display: grid; gap: 8px; }
      .filter-bar { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; }
      .chip-clear { margin-left: 6px; opacity: .7; }
      .toast {
        position: fixed; bottom: 20px; right: 20px;
        background: var(--panel-raised); border: 1px solid var(--border);
        border-radius: 9px; padding: 11px 18px; font-size: 13px;
        display: none; max-width: 440px; z-index: 50;
      }
      .toast.show { display: block; }
      .dot.wait { background: var(--amber); }
      .dot.err { background: var(--red); }
      .w-semibold { font-weight: 600; }
      .w-bold { font-weight: 700; }
    </style>
  </head>
  <body>
    <div class="shell">
      <nav>
        <div class="logo">Flor<em>ina</em></div>
        <div class="navitem active" data-view="inbox">
          ◈ Inbox<span class="navbadge zero" id="navInbox">0</span>
        </div>
        <div class="navitem" data-view="tasks">
          ◧ Tasks<span class="navbadge zero">0</span>
        </div>
        <div class="navitem" data-view="fleet">◔ Fleet</div>
        <div class="navitem" data-view="prefs">◍ Preferences</div>
        <div class="sidefoot">
          <div class="statusline">
            <span class="dot" id="dot"></span><span id="statusText">connecting…</span>
          </div>
        </div>
      </nav>
      <main>
        <header>
          <h1 id="viewTitle">Attention Inbox</h1>
          <span class="sub" id="viewSub">what needs you right now</span>
          <span class="spacer"></span>
        </header>
        <div class="content">
          <div class="column">
            <section class="view active" id="v-inbox"><div id="inbox"></div></section>
            <section class="view" id="v-tasks">
              <div class="empty"><div class="empty-big">Tasks</div>
                <div class="empty-hint">Task list view lands with the session inspector (#126).</div></div>
            </section>
            <section class="view" id="v-fleet">
              <div class="empty"><div class="empty-big">Fleet</div>
                <div class="empty-hint">Quota/capacity view lands in milestone 2 (#127).</div></div>
            </section>
            <section class="view" id="v-prefs">
              <div class="empty"><div class="empty-big">Preferences</div>
                <div class="empty-hint">Preference editor lands in milestone 2 (#128).</div></div>
            </section>
          </div>
        </div>
      </main>
    </div>
    <div class="toast" id="toast"></div>
    <script type="module" src="app.js"></script>
  </body>
</html>
