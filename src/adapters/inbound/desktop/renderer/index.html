<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'self' ws://127.0.0.1:* http://127.0.0.1:*"
    />
    <title>Florina</title>
    <style>
      :root {
        --bg: #0f1115;
        --sidebar: #14171d;
        --panel: #1a1e27;
        --panel2: #20252f;
        --border: #2a3040;
        --text: #e8ebf0;
        --dim: #8a93a6;
        --accent: #6e9eff;
        --green: #4cc38a;
        --red: #f06060;
        --amber: #e0a84f;
        --purple: #b08cff;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font:
          14px/1.55 -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        background: var(--bg);
        color: var(--text);
        height: 100vh;
        display: flex;
        overflow: hidden;
        -webkit-user-select: none;
      }
      /* ---- sidebar ---- */
      nav {
        width: 216px;
        flex-shrink: 0;
        background: var(--sidebar);
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        padding: 18px 12px;
      }
      .logo {
        font-size: 17px;
        font-weight: 700;
        padding: 0 10px 18px;
        letter-spacing: 0.4px;
      }
      .logo em {
        color: var(--accent);
        font-style: normal;
      }
      .navitem {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 8px 10px;
        border-radius: 8px;
        color: var(--dim);
        cursor: pointer;
        font-weight: 500;
        margin-bottom: 2px;
        border: 1px solid transparent;
      }
      .navitem:hover {
        background: var(--panel);
        color: var(--text);
      }
      .navitem.active {
        background: var(--panel2);
        color: var(--text);
        border-color: var(--border);
      }
      .navitem .glyph {
        width: 16px;
        text-align: center;
      }
      .navbadge {
        margin-left: auto;
        background: var(--accent);
        color: #0a1220;
        font-size: 11px;
        font-weight: 700;
        border-radius: 9px;
        padding: 0 7px;
        min-width: 18px;
        text-align: center;
      }
      .navbadge.zero {
        background: var(--panel2);
        color: var(--dim);
      }
      .sidefoot {
        margin-top: auto;
        padding: 10px;
        border-top: 1px solid var(--border);
      }
      .statusline {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        color: var(--dim);
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--dim);
      }
      .dot.on {
        background: var(--green);
        box-shadow: 0 0 6px var(--green);
      }
      .dot.err {
        background: var(--red);
      }
      .dot.wait {
        background: var(--amber);
      }
      /* ---- main ---- */
      main {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-width: 0;
      }
      header {
        padding: 16px 28px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: baseline;
        gap: 14px;
      }
      header h1 {
        font-size: 20px;
        font-weight: 650;
      }
      header .sub {
        color: var(--dim);
        font-size: 13px;
      }
      header .spacer {
        flex: 1;
      }
      .content {
        flex: 1;
        overflow-y: auto;
        padding: 22px 28px;
      }
      .view {
        display: none;
      }
      .view.active {
        display: block;
      }
      /* ---- items ---- */
      .card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 14px 16px;
        margin-bottom: 10px;
        border-left: 3px solid var(--border);
      }
      .card.Critical {
        border-left-color: var(--red);
      }
      .card.High {
        border-left-color: var(--amber);
      }
      .card.Medium {
        border-left-color: var(--accent);
      }
      .card.Low {
        border-left-color: var(--dim);
      }
      .card .top {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .card .kind {
        font-weight: 600;
        text-transform: capitalize;
      }
      .chip {
        font-size: 11px;
        font-weight: 600;
        padding: 1px 9px;
        border-radius: 10px;
        border: 1px solid var(--border);
        color: var(--dim);
        white-space: nowrap;
        text-transform: capitalize;
      }
      .chip.Critical {
        color: var(--red);
        border-color: var(--red);
      }
      .chip.High {
        color: var(--amber);
        border-color: var(--amber);
      }
      .chip.Medium {
        color: var(--accent);
        border-color: var(--accent);
      }
      .chip.running,
      .chip.delegated {
        color: var(--green);
        border-color: var(--green);
      }
      .chip.blocked,
      .chip.attention-needed {
        color: var(--amber);
        border-color: var(--amber);
      }
      .chip.failed,
      .chip.cancelled {
        color: var(--red);
        border-color: var(--red);
      }
      .chip.completed,
      .chip.reviewed,
      .chip.accepted {
        color: var(--purple);
        border-color: var(--purple);
      }
      .card .meta {
        color: var(--dim);
        font-size: 12px;
        margin-top: 6px;
        word-break: break-all;
      }
      .card .actions {
        margin-top: 10px;
        display: flex;
        gap: 8px;
      }
      .empty {
        color: var(--dim);
        text-align: center;
        padding: 60px 20px;
        font-size: 14px;
      }
      .empty .big {
        font-size: 15px;
        color: var(--text);
        margin-bottom: 6px;
      }
      /* ---- buttons / forms ---- */
      button {
        background: var(--accent);
        color: #0a1220;
        border: 0;
        border-radius: 7px;
        padding: 6px 14px;
        font-weight: 600;
        cursor: pointer;
        font-size: 13px;
      }
      button.ghost {
        background: transparent;
        color: var(--accent);
        border: 1px solid var(--border);
      }
      button.danger {
        background: transparent;
        color: var(--red);
        border: 1px solid var(--red);
      }
      button:hover {
        filter: brightness(1.15);
      }
      input,
      select {
        background: var(--bg);
        border: 1px solid var(--border);
        color: var(--text);
        border-radius: 7px;
        padding: 8px 11px;
        font-size: 13px;
        width: 100%;
      }
      input:focus,
      select:focus {
        outline: none;
        border-color: var(--accent);
      }
      .prefform {
        display: grid;
        grid-template-columns: 140px 1fr 1fr;
        gap: 8px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 14px;
        margin-top: 16px;
      }
      .prefform .wide {
        grid-column: span 2;
      }
      .prefform .all {
        grid-column: 1 / -1;
      }
      .prefline {
        font-family: ui-monospace, 'Cascadia Mono', Consolas, monospace;
        font-size: 12.5px;
        padding: 9px 14px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        margin-bottom: 8px;
        word-break: break-all;
      }
      .prefline .tag {
        color: var(--dim);
        font-weight: 700;
      }
      .prefline .tag.deny {
        color: var(--red);
      }
      .prefline .scope {
        color: var(--amber);
      }
      .prefline .note {
        color: var(--dim);
        font-style: italic;
      }
      /* ---- events ---- */
      #events {
        font-family: ui-monospace, 'Cascadia Mono', Consolas, monospace;
        font-size: 12px;
      }
      #events .ev {
        padding: 6px 10px;
        border-bottom: 1px dashed var(--border);
      }
      #events .t {
        color: var(--dim);
      }
      #events .k {
        color: var(--purple);
        font-weight: 600;
      }
      /* ---- metrics strip ---- */
      .mstrip {
        display: flex;
        gap: 18px;
        flex-wrap: wrap;
      }
      .mstat {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 12px 18px;
        min-width: 130px;
      }
      .mstat .v {
        font-size: 22px;
        font-weight: 700;
      }
      .mstat .k {
        color: var(--dim);
        font-size: 12px;
      }
      .toast {
        position: fixed;
        bottom: 20px;
        right: 20px;
        background: var(--panel2);
        border: 1px solid var(--accent);
        border-radius: 9px;
        padding: 11px 18px;
        font-size: 13px;
        display: none;
        max-width: 440px;
        z-index: 50;
      }
    </style>
  </head>
  <body>
    <nav>
      <div class="logo">Flor<em>ina</em></div>
      <div class="navitem active" data-view="inbox">
        <span class="glyph">◈</span>Inbox<span class="navbadge zero" id="navInbox">0</span>
      </div>
      <div class="navitem" data-view="tasks">
        <span class="glyph">◧</span>Tasks<span class="navbadge zero" id="navTasks">0</span>
      </div>
      <div class="navitem" data-view="prefs"><span class="glyph">◍</span>Preferences</div>
      <div class="navitem" data-view="events"><span class="glyph">≋</span>Events</div>
      <div class="sidefoot">
        <div class="statusline">
          <span class="dot" id="dot"></span><span id="statusText">connecting…</span>
        </div>
      </div>
    </nav>

    <main>
      <header>
        <h1 id="viewTitle">Attention Inbox</h1>
        <span class="sub" id="viewSub">what needs you right now</span>
        <span class="spacer"></span>
        <button class="ghost" id="refreshBtn">Refresh</button>
      </header>
      <div class="content">
        <section class="view active" id="v-inbox"><div id="inbox"></div></section>
        <section class="view" id="v-tasks"><div id="tasks"></div></section>
        <section class="view" id="v-prefs">
          <div id="prefList"></div>
          <form class="prefform" id="prefForm">
            <select name="action">
              <option value="add-rule">add-rule</option>
              <option value="deny">deny</option>
              <option value="remove-rule">remove-rule</option>
              <option value="remove-deny">remove-deny</option>
            </select>
            <input name="provider" placeholder="provider (codex, claude-code…)" required />
            <input name="model" placeholder="model (optional)" />
            <input
              name="projectId"
              class="wide"
              placeholder="projectId scope — optional, omit = global"
            />
            <input name="note" class="wide" placeholder="note — your own words (optional)" />
            <div class="all"><button type="submit">Apply</button></div>
          </form>
        </section>
        <section class="view" id="v-events">
          <div id="events"><div class="empty">Listening for daemon events…</div></div>
        </section>
      </div>
    </main>

    <div class="toast" id="toast"></div>

    <script>
      const DAEMON = 'ws://127.0.0.1:17419';
      let ws = null,
        pending = [],
        pollTimer = null;

      const $ = (id) => document.getElementById(id);
      const esc = (s) =>
        String(s ?? '').replace(
          /[&<>"]/g,
          (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c],
        );

      function toast(msg) {
        const t = $('toast');
        t.textContent = msg;
        t.style.display = 'block';
        clearTimeout(t._h);
        t._h = setTimeout(() => (t.style.display = 'none'), 4000);
      }

      /* ---- navigation ---- */
      const TITLES = {
        inbox: ['Attention Inbox', 'what needs you right now'],
        tasks: ['Tasks', 'delegated work and its state'],
        prefs: ['Preferences', 'durable routing rules and denies'],
        events: ['Events', 'live supervisor event stream'],
      };
      document.querySelectorAll('.navitem').forEach((n) =>
        n.addEventListener('click', () => {
          document.querySelectorAll('.navitem').forEach((x) => x.classList.remove('active'));
          document.querySelectorAll('.view').forEach((x) => x.classList.remove('active'));
          n.classList.add('active');
          $('v-' + n.dataset.view).classList.add('active');
          $('viewTitle').textContent = TITLES[n.dataset.view][0];
          $('viewSub').textContent = TITLES[n.dataset.view][1];
        }),
      );
      $('refreshBtn').addEventListener('click', refreshAll);

      /* ---- daemon socket ---- */
      function setStatus(state, label) {
        $('dot').className = 'dot ' + state;
        $('statusText').textContent = label;
      }

      function connect() {
        setStatus('wait', 'connecting…');
        ws = new WebSocket(DAEMON);
        ws.onopen = () => {
          setStatus('on', 'daemon connected');
          ws.send(JSON.stringify({ type: 'subscribe' }));
          refreshAll();
          pollTimer = setInterval(refreshAll, 3000);
        };
        ws.onclose = () => {
          setStatus('err', 'daemon disconnected — retrying');
          clearInterval(pollTimer);
          pending.forEach((p) => p({ ok: false }));
          pending = [];
          setTimeout(connect, 2500);
        };
        ws.onerror = () => {};
        ws.onmessage = (e) => {
          let m;
          try {
            m = JSON.parse(e.data);
          } catch {
            return;
          }
          if (m && 'ok' in m) {
            if (pending.length) pending.shift()(m);
          } else if (m && m.type) addEvent(m);
        };
      }

      function send(cmd) {
        return new Promise((resolve) => {
          if (!ws || ws.readyState !== WebSocket.OPEN) {
            resolve({ ok: false });
            return;
          }
          pending.push(resolve);
          ws.send(JSON.stringify(cmd));
        });
      }

      async function refreshAll() {
        const [inbox, tasks, prefs] = await Promise.all([
          send({ kind: 'query-inbox' }),
          send({ kind: 'list-tasks' }),
          send({ kind: 'query-preferences' }),
        ]);
        renderInbox(inbox);
        renderTasks(tasks);
        renderPrefs(prefs);
      }

      /* ---- inbox ---- */
      function renderInbox(r) {
        const items = (r && r.items) || [];
        const badge = $('navInbox');
        badge.textContent = items.length;
        badge.className = 'navbadge' + (items.length ? '' : ' zero');
        const el = $('inbox');
        if (!items.length) {
          el.innerHTML =
            '<div class="empty"><div class="big">All clear</div>Nothing needs your attention.</div>';
          return;
        }
        el.innerHTML = items
          .map((i) => {
            const approvalId = i.payload && i.payload.approvalId;
            return `<div class="card ${esc(i.priority)}">
      <div class="top">
        <span class="kind">${esc(i.kind.replace(/-/g, ' '))}</span>
        <span class="chip ${esc(i.priority)}">${esc(i.priority)}</span>
        <span class="chip">${esc(i.status)}</span>
      </div>
      <div class="meta">${esc(i.id)} · task ${esc(i.taskId)} · ${esc(new Date(i.createdAt).toLocaleString())}</div>
      ${
        approvalId
          ? `<div class="actions">
        <button data-approve="grant" data-task="${esc(i.taskId)}" data-ap="${esc(approvalId)}">Approve</button>
        <button class="danger" data-approve="deny" data-task="${esc(i.taskId)}" data-ap="${esc(approvalId)}">Deny</button>
      </div>`
          : ''
      }
    </div>`;
          })
          .join('');
        el.querySelectorAll('[data-approve]').forEach((b) =>
          b.addEventListener('click', async () => {
            const res = await send({
              kind: 'approve',
              taskId: b.dataset.task,
              approvalId: b.dataset.ap,
              decision: b.dataset.approve,
            });
            toast(
              res.ok
                ? `Decision recorded: ${b.dataset.approve}`
                : `Failed: ${res.error || 'unknown'}`,
            );
            refreshAll();
          }),
        );
      }

      /* ---- tasks ---- */
      function renderTasks(r) {
        const tasks = (r && r.tasks) || [];
        const badge = $('navTasks');
        badge.textContent = tasks.length;
        badge.className = 'navbadge' + (tasks.length ? '' : ' zero');
        const el = $('tasks');
        if (!tasks.length) {
          el.innerHTML =
            '<div class="empty"><div class="big">No tasks yet</div>Delegated work shows up here.</div>';
          return;
        }
        el.innerHTML = tasks
          .map(
            (t) => `
    <div class="card">
      <div class="top"><span class="kind">${esc(t.objective.slice(0, 110))}</span>
        <span class="chip ${esc(t.state)}">${esc(t.state)}</span></div>
      <div class="meta">${esc(t.id)} · project ${esc(t.projectId)} · ${t.eventCount} events · agents: ${esc(t.agentIds.join(', ') || '—')}</div>
    </div>`,
          )
          .join('');
      }

      /* ---- preferences ---- */
      function renderPrefs(r) {
        const el = $('prefList');
        const p = r && r.profile;
        const rules = (p && p.rules) || [];
        const denied = (p && p.denied) || [];
        if (!rules.length && !denied.length) {
          el.innerHTML =
            '<div class="empty"><div class="big">No preferences recorded</div>Add a rule or deny below — or tell Florina by voice.</div>';
          return;
        }
        const fmt = (e, tag) =>
          `<div class="prefline"><span class="tag ${tag}">${tag.toUpperCase()}</span> ` +
          `${esc(e.provider)}${e.model ? '/' + esc(e.model) : ''}` +
          `${e.workTypes ? ` · work=[${esc(e.workTypes.join(', '))}]` : ' · catch-all'}` +
          `${e.projectId ? ` <span class="scope">project:${esc(e.projectId)}</span>` : ''}` +
          `${e.note ? ` <span class="note">— ${esc(e.note)}</span>` : ''}</div>`;
        el.innerHTML =
          rules.map((x) => fmt(x, 'rule')).join('') + denied.map((x) => fmt(x, 'deny')).join('');
      }

      $('prefForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const f = new FormData(e.target);
        const cmd = {
          kind: 'update-preference',
          action: f.get('action'),
          provider: String(f.get('provider') || '').trim(),
        };
        for (const k of ['model', 'projectId', 'note']) {
          const v = String(f.get(k) || '').trim();
          if (v) cmd[k] = v;
        }
        const res = await send(cmd);
        toast(res.ok ? `Preference ${cmd.action} applied` : `Failed: ${res.error || 'unknown'}`);
        if (res.ok) {
          e.target.reset();
          refreshAll();
        }
      });

      /* ---- events ---- */
      let evN = 0;
      function addEvent(ev) {
        const el = $('events');
        if (evN === 0) el.innerHTML = '';
        evN++;
        const d = document.createElement('div');
        d.className = 'ev';
        d.innerHTML =
          `<span class="t">${esc(new Date().toLocaleTimeString())}</span> ` +
          `<span class="k">${esc(ev.type)}</span> ${esc(JSON.stringify(ev).slice(0, 240))}`;
        el.prepend(d);
        while (el.children.length > 300) el.removeChild(el.lastChild);
      }

      connect();
    </script>
  </body>
</html>
