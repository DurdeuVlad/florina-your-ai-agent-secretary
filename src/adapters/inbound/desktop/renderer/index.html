<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' ws://127.0.0.1:*"
    />
    <title>Florina</title>
    <link rel="stylesheet" href="tokens.css" />
    <style>
      body {
        height: 100vh;
        overflow: hidden;
        -webkit-user-select: none;
      }
      .card.sel {
        outline: 1px solid var(--accent);
      }
      .empty-big {
        font-size: 16px;
        font-weight: 600;
        margin-bottom: 4px;
      }
      .empty-hint {
        color: var(--muted);
        font-size: 13px;
      }
      /* preferences inline forms (issue #128) */
      .pref-addbar {
        display: flex;
        justify-content: flex-end;
        margin-bottom: 4px;
      }
      .pref-form {
        display: flex;
        gap: 6px;
        margin-top: 8px;
      }
      .pref-addform {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .pref-form input,
      .pref-addform input {
        flex: 1;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 6px;
        color: var(--text);
        font: inherit;
        font-size: 12px;
        padding: 5px 8px;
        outline: none;
      }
      .pref-form input:focus,
      .pref-addform input:focus {
        border-color: var(--accent);
      }
      .icon {
        font-size: 13px;
      }
      .group-items {
        display: grid;
        gap: 8px;
      }
      .filter-bar {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-bottom: 12px;
      }
      .chip-clear {
        margin-left: 6px;
        opacity: 0.7;
      }
      .toast {
        position: fixed;
        bottom: 20px;
        right: 20px;
        background: var(--panel-raised);
        border: 1px solid var(--border);
        border-radius: 9px;
        padding: 11px 18px;
        font-size: 13px;
        display: none;
        max-width: 440px;
        z-index: 50;
      }
      .toast.show {
        display: block;
      }
      .dot.wait {
        background: var(--amber);
      }
      .dot.err {
        background: var(--red);
      }
      .w-semibold {
        font-weight: 600;
      }
      .w-bold {
        font-weight: 700;
      }
      .empty {
        padding: 48px 0;
        text-align: center;
        color: var(--muted);
      }
      .sect-label {
        letter-spacing: 1.2px;
      }
      .obj {
        font-weight: 600;
      }
      .stat.done {
        color: var(--muted);
      }
      .sect .n {
        margin-left: auto;
      }
      /* view switching (#126) */
      .view {
        display: none;
      }
      .view.active {
        display: block;
      }
      /* session inspector (#126): full-width, full-height 3 columns */
      .column {
        height: 100%;
      }
      .column:has(> #v-tasks.active) {
        max-width: none;
      }
      #v-tasks.active {
        display: flex;
        flex-direction: column;
        height: 100%;
      }
      #inspector {
        flex: 1;
        min-height: 0;
      }
      .col .row.cond {
        opacity: 0.62;
      }
      .col.colfocus {
        border-color: var(--accent);
      }
      .col .row.kbsel {
        outline: 1px solid var(--accent);
        outline-offset: -1px;
      }
      .col .row .t {
        display: block;
      }
      .col .row b {
        display: block;
        font-weight: 600;
      }
      .fidelity {
        margin: 10px 14px 0;
        padding: 7px 10px;
        font-size: 11.5px;
        color: var(--amber);
        border: 1px dashed var(--amber);
        border-radius: 6px;
      }
      .col .mono {
        padding: 12px 14px;
        line-height: 1.55;
      }
      /* PTT pill merged into the header (was the floating overlay) */
      .hud.pill {
        width: auto;
        padding: 6px 14px 6px 8px;
        box-shadow: none;
        cursor: pointer;
        flex-shrink: 0;
      }
      .hud.pill .ring {
        width: 30px;
        height: 30px;
        font-size: 13px;
      }
      .hud.pill .hudtext {
        max-width: 240px;
      }
      .hud.pill .hudtext span {
        display: block;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <nav>
        <div class="logo">Flor<em>ina</em></div>
        <div class="navitem active" data-view="inbox">
          ◈ Inbox<span class="navbadge zero" id="navInbox">0</span>
        </div>
        <div class="navitem" data-view="tasks">◧ Tasks<span class="navbadge zero">0</span></div>
        <div class="navitem" data-view="fleet">◔ Fleet</div>
        <div class="navitem" data-view="prefs">◍ Preferences</div>
        <div class="sidefoot">
          <div class="statusline">
            <span class="dot" id="dot"></span><span id="statusText">connecting…</span>
          </div>
        </div>
      </nav>
      <main>
        <header>
          <h1 id="viewTitle">Attention Inbox</h1>
          <span class="sub" id="viewSub">what needs you right now</span>
          <span class="spacer"></span>
          <div class="hud pill" id="hud" data-command="ptt:toggle" title="Push to talk">
            <div class="ring" id="ring">🎙</div>
            <div class="hudtext"><b id="hudTitle">Push to talk</b><span id="hudSub"></span></div>
          </div>
        </header>
        <div class="content">
          <div class="column">
            <section class="view active" id="v-inbox"><div id="inbox"></div></section>
            <section class="view" id="v-tasks"><div id="inspector"></div></section>
            <section class="view" id="v-fleet"><div id="fleet"></div></section>
            <section class="view" id="v-prefs"><div id="prefs"></div></section>
          </div>
        </div>
      </main>
    </div>
    <div class="toast" id="toast"></div>
    <script type="module" src="app.js"></script>
  </body>
</html>
