<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  body { margin: 0; background: #0b0b0c; font-family: 'Segoe UI', system-ui, sans-serif; color: #ececf1; }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 24px; padding: 24px; }
  .cell { background: #131315; border: 1px solid #2d2d31; border-radius: 14px; padding: 20px; text-align: center; }
  .cell img.big { width: 280px; height: 280px; }
  .label { font-size: 16px; margin-top: 10px; color: #93939d; }
  .sizes img { width: 48px; height: 48px; margin: 0 8px; vertical-align: middle; }
  .sizes img.tiny { width: 16px; height: 16px; }
  .sizes { margin-top: 8px; font-size: 12px; color: #6b7280; }
  .inapp { display: flex; align-items: center; gap: 14px; background: #1c1c1f; border: 1px solid #2d2d31; border-radius: 10px; padding: 12px; margin: 10px 24px; }
  .inapp img { width: 40px; height: 40px; border-radius: 9px; }
  .inapp .t { font-size: 14px; }
  .current { display:flex; align-items:center; gap:14px; padding: 12px 24px; color:#93939d; font-size:13px; }
  .current img { width: 56px; height:56px; border-radius:13px; }
</style>
</head>
<body>
<div class="current"><img src="../assets/icon.png" /> Current shipped icon (assets/icon.png) — navy #122a4c→#0d2040 + white</div>
<div class="grid">
  <div class="cell">
    <img class="big" src="gen-a/logo-b-r3.svg" />
    <div class="label">1 — Leafed F · navy + amber</div>
    <div class="sizes">48/32/16: <img src="gen-a/logo-b-r3.svg" /><img src="gen-a/logo-b-r3.svg" style="width:32px;height:32px"/><img class="tiny" src="gen-a/logo-b-r3.svg" /></div>
  </div>
  <div class="cell">
    <img class="big" src="gen-b/logo-a-r3.svg" />
    <div class="label">2 — Confluence · navy + amber</div>
    <div class="sizes">48/32/16: <img src="gen-b/logo-a-r3.svg" /><img src="gen-b/logo-a-r3.svg" style="width:32px;height:32px"/><img class="tiny" src="gen-b/logo-a-r3.svg" /></div>
  </div>
</div>
<h3 style="margin:4px 24px;font-size:14px;color:#93939d">In-app context (panel #1c1c1f)</h3>
<div class="inapp"><img src="gen-a/logo-b-r3.svg" /><span class="t">Florina</span></div>
<div class="inapp"><img src="gen-b/logo-a-r3.svg" /><span class="t">Florina</span></div>
</body>
</html>
