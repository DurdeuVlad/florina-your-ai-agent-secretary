<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  body { margin: 0; background: #1a1d21; font-family: 'Segoe UI', system-ui, sans-serif; color: #e8e8e8; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; padding: 24px; }
  .cell { background: #24282d; border-radius: 12px; padding: 16px; text-align: center; }
  .cell img { width: 220px; height: 220px; }
  .label { font-size: 15px; margin-top: 8px; color: #aeb4ba; }
  .small img { width: 32px; height: 32px; vertical-align: middle; }
  .small { margin-top: 6px; font-size: 12px; color: #6b7280; }
  h2 { margin: 20px 24px 0; font-size: 18px; font-weight: 600; }
</style>
</head>
<body>
<h2>Generator 1</h2>
<div class="grid">
  <div class="cell"><img src="gen-a/logo-a.svg" /><div class="label">A — Tributary</div><div class="small">32px: <img src="gen-a/logo-a.svg" /></div></div>
  <div class="cell"><img src="gen-a/logo-b.svg" /><div class="label">B — Leafed F</div><div class="small">32px: <img src="gen-a/logo-b.svg" /></div></div>
  <div class="cell"><img src="gen-a/logo-c.svg" /><div class="label">C — Filter Bloom</div><div class="small">32px: <img src="gen-a/logo-c.svg" /></div></div>
</div>
<h2>Generator 2</h2>
<div class="grid">
  <div class="cell"><img src="gen-b/logo-a.svg" /><div class="label">A — Confluence</div><div class="small">32px: <img src="gen-b/logo-a.svg" /></div></div>
  <div class="cell"><img src="gen-b/logo-b.svg" /><div class="label">B — Flagged F</div><div class="small">32px: <img src="gen-b/logo-b.svg" /></div></div>
  <div class="cell"><img src="gen-b/logo-c.svg" /><div class="label">C — Presented</div><div class="small">32px: <img src="gen-b/logo-c.svg" /></div></div>
</div>
</body>
</html>
