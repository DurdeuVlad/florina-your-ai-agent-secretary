        const st = STATUS[c.status];
        return `<button class="seat ${c.status} ${sel ? 'sel' : ''}" data-act="open-cmdr" data-id="${c.id}" data-key="seat-${c.id}" data-nav ${sel ? 'aria-current="true"' : ''}>
          <span class="mono-badge" aria-hidden="true">${esc(c.mono)}</span>
          <span class="seat-main">
            <span class="seat-top"><b class="seat-name">${esc(c.name)}</b><span class="seat-status ${st.tone}">${esc(statusWord(c))}</span></span>
            ${c.chatter ? `<span class="seat-obj chatter">✓ ${esc(c.chatter)}</span>` : `<span class="seat-obj">${esc(c.objective)}</span>`}
            <span class="seat-prog"><span class="segs" aria-hidden="true">${c.orders.map((o) => `<i class="seg ${o.state}"></i>`).join('')}</span><span class="seat-count">${v} of ${c.orders.length} verified</span><span class="seat-handled" title="Problems handled without you today">${CHECK}<span class="sr">handled today: </span><span>${c.handled}</span></span></span>
          </span>
        </button>`;
      }

      function renderRail() {
        const list = $('#railList');
        if (!S.commanders.length) {
          list.innerHTML = `<div class="calm" style="padding:16px 12px"><div class="big">No commanders yet.</div><div class="hint">Appoint one per project and they will show up here.</div></div>`;
        } else {
          const order = {
            critical: 0,
            awaiting: 1,
            holding: 2,
            paused: 2,
            verifying: 3,
            advancing: 3,
            briefed: 3,
            idle: 4,
          };
          const sorted = [...S.commanders].sort((a, b) => order[a.status] - order[b.status]);
          list.innerHTML = sorted.map(seatHTML).join('');
          if (!ritualDone && URLQ.get('sim') !== '0') {
            ritualDone = true;
            list.classList.add('ritual');
            $$('.seat', list).forEach((el, i) => el.style.setProperty('--i', i));
            later(() => list.classList.remove('ritual'), 900);
          }
        }
        $('#appointBtn').setAttribute('aria-disabled', offline() ? 'true' : 'false');
      }

      function renderTabs() {
        const items = [
          ['table', 'The Table'],
          ['record', 'Record'],
          ['standing', 'Standing orders'],
        ];
        const cur = S.view === 'commander' ? 'table' : S.view;
        $('#tabs').innerHTML = items
          .map(
            ([k, l]) =>
              `<button class="tab" data-act="view" data-id="${k}" ${cur === k ? 'aria-current="page"' : ''}>${l}</button>`,
          )
          .join('');
        const d = offline() ? ['err', 'Daemon unreachable'] : ['on', 'Daemon connected'];
        $('#daemon').innerHTML = `<span class="dot ${d[0]}"></span><span>${d[1]}</span>`;
      }

      function orbSVG() {
        return `<svg class="orb" viewBox="0 0 64 64" aria-hidden="true"><circle class="ring" cx="32" cy="32" r="26"/><circle class="core" cx="32" cy="32" r="18"/><g class="bars"><rect x="22" y="26" width="3.4" height="12" rx="1.7"/><rect x="28" y="22" width="3.4" height="20" rx="1.7"/><rect x="34" y="24" width="3.4" height="16" rx="1.7"/><rect x="40" y="27" width="3.4" height="10" rx="1.7"/></g></svg>`;
      }

      function disabledAttr() {
        return offline() ? ' aria-disabled="true" title="Daemon offline. Reconnecting."' : '';
      }

      function florinaHTML() {
        const b = briefing();
        const cap =
          S.voice === 'listening'
            ? `<p class="sub caption" aria-hidden="true"><b>I’m hearing</b>${esc(S.caption) || '…'}</p>`
            : S.voice === 'thinking'
              ? `<p class="sub caption" aria-hidden="true"><b>Thinking</b>Working out which commander this is for…</p>`
              : S.voice === 'speaking'
                ? `<p class="sub caption" aria-hidden="true"><b>Speaking</b>${esc(b.head)} ${esc(b.sub)}</p>`
                : '';
        const n = S.calls.length,
          rc = reportCount();
        const stats = S.firstRun
          ? ''
          : `<div class="strip">
          <button class="stat ${n ? 'amber' : ''}" data-act="focus-calls"><b>${n}</b> need${n === 1 ? 's' : ''} you</button>
          <button class="stat" data-act="drawer" data-id="handled" aria-expanded="${S.drawer === 'handled'}"><b>${handledToday()}</b> handled for you</button>
          ${(() => {
            const out = S.supplies.filter((x) => x.used >= 100);
            const hot = S.supplies.filter((x) => x.used >= 80 && x.used < 100);
            const txt = out.length
              ? `<b>${out.map((x) => esc(x.p)).join(', ')}</b> out until ${fmt(Math.min(...out.map((x) => x.resets)))}`
              : hot.length
                ? `<b>${hot.map((x) => esc(x.p)).join(', ')}</b> running low`
                : '<b>Supplies</b> fine';
            return `<button class="stat ${out.length || hot.length ? 'amber' : ''}" data-act="drawer" data-id="supplies" aria-expanded="${S.drawer === 'supplies'}">${txt}</button>`;
          })()}
          <button class="stat" data-act="drawer" data-id="minutes" aria-expanded="${S.drawer === 'minutes'}">Minutes</button>
          <button class="stat" data-act="drawer" data-id="desk" aria-expanded="${S.drawer === 'desk'}">Florina’s desk${S.desk.memory.length ? ` <b>${S.desk.memory.length}</b>` : ''}</button>
        </div>`;
        const tools = S.firstRun
          ? ''
          : `<div class="tools">
          <label class="switch"><input type="checkbox" id="holdCalls" data-key="hold-calls" ${S.holdCalls ? 'checked' : ''} /><span class="track"></span>Hold my calls</label>
          <button class="btn ghost" data-act="catchup"${disabledAttr()}>Catch me up</button>
        </div>`;
        return `<section class="florina" id="florina" data-voice="${S.voice}" data-tone="${b.tone}" aria-labelledby="headline">
          ${orbSVG()}
          <div class="copy"><div class="state">Florina · ${esc(b.state)}</div><h1 id="headline">${esc(b.head)}</h1>${cap || `<p class="sub">${esc(b.sub)}</p>`}</div>
          ${tools}${stats}
        </section>`;
      }

      function callHTML(c) {
        const cm = cmdr(c.cmdr);
        const opts = c.choice
          ? `<div class="opts" role="group" aria-label="Options">${c.options.map((o, i) => `<button class="opt ${o.key === c.reco.key ? 'reco-pick' : ''}" data-act="resolve" data-id="${c.id}" data-opt="${o.key}" ${i === 0 ? 'data-primary' : ''}${disabledAttr()}><span class="l">${esc(o.label)}${o.key === c.reco.key ? '<span class="tag">Florina’s pick</span>' : ''}</span><span class="d">${esc(o.detail || '')}</span></button>`).join('')}</div>`
          : `<div class="actions">${c.options
              .map((o, i) => {
                const armed = S.armed && S.armed.id === c.id && S.armed.opt === o.key;
                return `<button class="btn ${o.primary ? 'primary' : ''} ${armed ? 'armed' : ''}" data-act="resolve" data-id="${c.id}" data-opt="${o.key}" ${i === 0 ? 'data-primary' : ''}${disabledAttr()}>${esc(armed ? o.confirmLabel : o.label)}${i === 0 && !armed ? '<kbd>Enter</kbd>' : ''}</button>`;
              })
              .join(
                '',
              )}<button class="btn ghost" data-act="later" data-id="${c.id}"${disabledAttr()}>Later</button><button class="btn ghost" data-act="inspect" data-id="${c.id}">Inspect</button></div>`;
        const choiceActions = c.choice
          ? `<div class="actions"><button class="btn ghost" data-act="later" data-id="${c.id}"${disabledAttr()}>Later</button><button class="btn ghost" data-act="inspect" data-id="${c.id}">Inspect</button></div>`
          : '';
        const recoOpt = c.options.find((o) => o.key === c.reco.key);
        const recoBox = `<div class="reco"><b>Florina recommends: ${esc(recoOpt.label)}.</b><span class="why">${esc(c.reco.why)}</span></div>`;
        return `<article class="call ${c.pri} ${seen.has(c.id) ? '' : 'enter'}" id="${c.id}" data-nav data-key="call-${c.id}" tabindex="-1" aria-labelledby="t-${c.id}">
          <div class="top"><span class="kind">${esc(c.kind)}</span><span class="chip ${c.pri}">${c.pri}</span><span>${esc(cm ? cm.name : '')}</span><span class="when">${c.age ? c.age + ' min ago' : 'just now'}</span></div>
          <h3 id="t-${c.id}">${esc(c.title)}</h3>
          ${recoBox}
          <div class="observed" aria-label="Observed facts">${c.observed.map(([k, v]) => `<span><b>${esc(k)}</b>${esc(v)}</span>`).join('')}</div>
          <div class="blocking">${esc(c.blocking)}</div>
          ${opts}${choiceActions}
        </article>`;
      }

      function reportHTML(r) {
        const cm = cmdr(r.cmdr);
        const open = S.openProof[r.id];
        const proof =
          open && r.proof
            ? `<div class="prove"><ol>${r.proof.map(([k, v]) => `<li><b>${esc(k)}</b><span>${esc(v)}</span></li>`).join('')}</ol></div>`
            : '';
        const items =
          open && r.items
            ? `<div class="prove"><ol>${r.items.map((x) => `<li><b>Report</b><span>${esc(x)}</span></li>`).join('')}</ol></div>`
            : '';
        return `<article class="report ${seen.has(r.id) ? '' : 'enter'}" data-nav data-key="rep-${r.id}" tabindex="-1" aria-labelledby="t-${r.id}">
          <div class="top"><span class="done">${r.group ? r.count + ' reports' : 'Delivered'}</span><span>${esc(cm ? cm.name : '')}</span></div>
          <h3 id="t-${r.id}">${esc(r.title)}</h3>
          <div class="evidence">${r.evidence.map((e, i) => `<span class="${i === 0 && !r.group ? 'ok' : ''}">${esc(e)}</span>`).join(' · ')}</div>
          ${r.risk ? `<div class="risk">Risk: ${esc(r.risk)}</div>` : ''}
          ${r.along && r.along.length ? `<div class="along">Handled on the way: ${r.along.map(esc).join(' · ')}</div>` : ''}
          ${proof}${items}
          <div class="actions">
            <button class="btn primary" data-act="accept" data-id="${r.id}" ${'data-primary'}${disabledAttr()}>${r.group ? 'Accept all' : 'Accept'}<kbd>Enter</kbd></button>
            ${r.group ? '' : `<button class="btn" data-act="pr" data-id="${r.id}"${disabledAttr()}>Open PR</button><button class="btn ghost" data-act="sendback" data-id="${r.id}"${disabledAttr()}>Send back</button>`}
            <button class="btn ghost" data-act="prove" data-id="${r.id}" aria-expanded="${!!open}">${r.group ? 'Read all' : 'Prove it'}</button>
          </div>
        </article>`;
      }

      function tableHTML() {
        if (S.firstRun) return firstRunHTML();
        const calls = S.calls.length
          ? `<div class="stack">${S.calls.slice(0, 3).map(callHTML).join('')}</div>${S.calls.length > 3 ? `<p class="muted" style="margin-top:12px">+${S.calls.length - 3} more, lower urgency. Answer these first.</p>` : ''}`
          : `<div class="calm"><div class="big">Nothing needs you.</div><div class="hint">Your commanders are handling it. Anything that needs a human call lands here.</div></div>`;
        if (!S.calls.length && !S.reports.length) {
          const recent = S.handled.slice(0, 4);
          return `${florinaHTML()}<section class="calm-feed" aria-labelledby="z-recent"><div class="zone-head"><h2 class="label" id="z-recent">Handled while you were heads-down</h2><button class="more" data-act="drawer" data-id="handled">See all ${handledToday()} →</button></div>
            ${recent.length ? `<div class="rows">${recent.map((h) => `<div class="row"><span class="glyph verified" aria-hidden="true">✓</span><div>${esc(h.what)}<span class="sub">${esc(h.did)} · ${esc((cmdr(h.cmdr) || { name: h.cmdr }).name)}</span></div><span class="when">${fmt(h.t)}</span></div>`).join('')}</div>` : '<p class="muted">Nothing has gone wrong today.</p>'}
            <p class="muted" style="margin-top:16px;font-size:13px">Anything that needs a human call, and every finished report, lands here with its proof attached.</p></section>`;
        }
        const reps = S.reports.length
          ? S.reports.map(reportHTML).join('')
          : `<div class="calm"><div class="big">No reports waiting.</div><div class="hint">Finished work arrives here with its proof attached.</div></div>`;
        return `${florinaHTML()}
          <div class="zones">
            <section aria-labelledby="z-calls" id="zone-calls"><div class="zone-head"><h2 class="label" id="z-calls">Your call</h2><span class="n">${S.calls.length}</span></div>${calls}</section>
            <section aria-labelledby="z-reps"><div class="zone-head"><h2 class="label" id="z-reps">Reports in</h2><span class="n">${reportCount()}</span></div>${reps}</section>
          </div>`;
      }

      function firstRunHTML() {
        const f = S.firstRun;
        let body = '';
        if (f.step === 'welcome') {
          body = `<div class="firstrun"><p class="muted">I look for git repositories in the folders you choose. I never change anything while looking.</p><div class="actions"><button class="btn primary" data-act="fr-scan" data-primary>Choose folders…</button></div></div>`;
        } else if (f.step === 'pick') {
          body = `<div class="firstrun"><div class="label">Found 3 repositories</div>${f.repos.map((r) => `<label class="repo"><input type="checkbox" data-repo="${r.id}" ${r.on ? 'checked' : ''}/> <span>${esc(r.name)}</span><span class="mono">${esc(r.path)}</span></label>`).join('')}<div class="actions"><button class="btn primary" data-act="fr-appoint" data-primary>Appoint ${pl(f.repos.filter((r) => r.on).length, 'commander')}</button></div></div>`;
        }
        return `${florinaHTML()}${body}`;
      }

      function commanderHTML() {
        const c = cmdr(S.cmdrId);
        if (!c) return tableHTML();
        const st = STATUS[c.status];
        const calls = S.calls.filter((x) => x.cmdr === c.id);
        const reps = S.reports.filter((x) => x.cmdr === c.id);
        const handled = S.handled.filter((h) => h.cmdr === c.id);
        return `<div class="crumbs"><button data-act="view" data-id="table">‹ The Table</button><span aria-hidden="true">/</span><span>${esc(c.name)}</span></div>
          <header class="cmdr-title"><h1 id="cmdr-h" tabindex="-1">${esc(c.name)}</h1><span class="seat-status ${st.tone}">${esc(statusWord(c))}</span>${c.workers.map((w) => `<span class="chip">${esc(w)}</span>`).join('')}</header>
          <p class="muted">${esc(c.objective)}</p>
          ${c.holdReason ? `<p class="risk" style="margin-top:8px">${esc(c.holdReason)}</p>` : ''}
          <div class="actions" style="margin-top:16px">
            <button class="btn" data-act="pause" data-id="${c.id}"${disabledAttr()}>${c.paused ? 'Resume this front' : 'Hold this front'}</button>
            <button class="btn" data-act="redirect" data-id="${c.id}"${disabledAttr()}>Give it a new order</button>
            ${c.status === 'holding' ? `<button class="btn" data-act="override" data-id="${c.id}"${disabledAttr()}>Run on Claude Code anyway</button>` : ''}
            <button class="btn ghost" data-act="timeline" data-id="${c.id}">Open full timeline</button>
          </div>
          ${calls.length ? `<section style="margin-top:24px" aria-label="Calls for this front"><div class="zone-head"><h2 class="label">Needs your call</h2></div><div class="stack">${calls.map(callHTML).join('')}</div></section>` : ''}
          ${reps.length ? `<section style="margin-top:24px" aria-label="Reports for this front"><div class="zone-head"><h2 class="label">Reports in</h2></div>${reps.map(reportHTML).join('')}</section>` : ''}
          <div class="cmdr-grid">
            <section aria-labelledby="ord"><div class="zone-head"><h2 class="label" id="ord">Orders</h2><span class="n">${c.orders.filter((o) => o.state === 'verified').length} of ${c.orders.length} verified</span></div>
              <div class="rows">${c.orders.map((o) => `<div class="row"><span class="glyph ${o.state}" aria-hidden="true">${ORDER_GLYPH[o.state]}</span><div>${esc(o.title)}<span class="sub">${esc(o.note || '')}</span></div><span class="when">${ORDER_WORD[o.state]}</span></div>`).join('')}</div>
            </section>
            <section aria-labelledby="hl"><div class="zone-head"><h2 class="label" id="hl">Handled here</h2><span class="n">${c.handled} today</span></div>
              ${handled.length ? `<div class="rows">${handled.map((h) => `<div class="row"><span class="glyph verified" aria-hidden="true">✓</span><div>${esc(h.what)}<span class="sub">${esc(h.did)}</span></div><span class="when">${fmt(h.t)}</span></div>`).join('')}</div>` : `<p class="muted">Nothing has gone wrong on this front today.</p>`}
              <div class="zone-head" style="margin-top:24px"><h2 class="label">Limits</h2></div>
              <p class="muted" style="font-size:13px">Asks you before: push, merge, deploy, network outside approved hosts, migrations.<br/>Track record: ${esc(c.record)}.</p>
            </section>
          </div>`;
      }

      function recordHTML() {
        const q = S.recQuery.toLowerCase();
        let items = S.record.filter(
          (r) =>
            (S.recFilter === 'all' || r.type === S.recFilter) &&
            (!q || (r.title + ' ' + r.sub).toLowerCase().includes(q)),
        );
        items = items.sort((a, b) => (a.day === b.day ? b.t - a.t : a.day === 'Today' ? -1 : 1));
        let last = '';
        const rows = items
          .map((r) => {
            const head = r.day !== last ? `<div class="label group-label">${esc(r.day)}</div>` : '';
            last = r.day;
            return `${head}<div class="rec-item"><span class="when">${fmt(r.t)}</span><div>${esc(r.title)}<span class="sub">${esc(r.sub)}</span></div><span class="chip">${r.type}</span></div>`;
          })
          .join('');
        const f = (k, l) =>
          `<button class="pill" data-act="recfilter" data-id="${k}" aria-pressed="${S.recFilter === k}">${l}</button>`;
        return `<div class="page"><div><h1>Record</h1><p class="lede">Everything that happened, with its proof. Summaries are projections: the journal underneath is never edited.</p></div>
          <div class="filters"><input type="search" id="recq" placeholder="Search the record" aria-label="Search the record" value="${esc(S.recQuery)}" />${f('all', 'All')}${f('report', 'Reports')}${f('decision', 'Decisions')}${f('handled', 'Handled')}</div>
          <div>${rows || '<p class="muted">Nothing matches.</p>'}</div></div>`;
      }

      function standingHTML() {
        return `<div class="page"><div><h1>Standing orders</h1><p class="lede">The rules your commanders follow without asking. Florina proposes new ones when she sees you repeat yourself, and never applies one you have not confirmed.</p></div>
          <section aria-labelledby="so1"><div class="zone-head"><h2 class="label" id="so1">Rules of engagement</h2><span class="n">${S.rules.length}</span></div>
            ${S.rules.map((r) => `<div class="rule"><span class="id">${r.id}</span><div>${esc(r.text)}<div class="sub"><span class="chip">${esc(r.kind)}</span><span>${esc(r.scope)}</span><span>·</span><span>${esc(r.from)}</span>${r.note ? `<span>·</span><span class="inferred">${esc(r.note)}</span>` : ''}</div></div>${r.locked ? '<span class="muted" style="font-size:12px" title="Hard policies are never learned or loosened automatically">Locked</span>' : `<button class="btn ghost" data-act="revoke" data-id="${r.id}">Revoke</button>`}</div>`).join('')}
          </section>
          <section aria-labelledby="so2"><div class="zone-head"><h2 class="label" id="so2">How Florina works with you</h2></div>
            <div class="setting"><div>Hold my calls<span class="sub">Only urgent things interrupt. Everything else waits on the Table for your next look.</span></div><label class="switch"><input type="checkbox" id="holdCalls2" data-key="hold-calls-2" ${S.holdCalls ? 'checked' : ''}/><span class="track"></span><span class="sr">Hold my calls</span></label></div>
            <div class="setting"><div>Speak briefings aloud<span class="sub">Only when you press Catch me up. Talking to her cuts her off.</span></div><label class="switch"><input type="checkbox" id="speakT" data-key="speak-t" ${S.speak ? 'checked' : ''}/><span class="track"></span><span class="sr">Speak briefings aloud</span></label></div>
            <div class="setting"><div>Read back orders<span class="sub">Before a new order goes out, Florina says what she understood.</span></div><select id="readback" aria-label="Read back orders"><option value="always" ${S.readback === 'always' ? 'selected' : ''}>Always</option><option value="unsure" ${S.readback === 'unsure' ? 'selected' : ''}>Only when unsure</option></select></div>
          </section>
          <section aria-labelledby="so3"><div class="zone-head"><h2 class="label" id="so3">Everything else</h2></div>
            <p class="stub">Providers and supplies, API keys, repos, microphone and push-to-talk keep their current screens inside this section. Not redrawn in this prototype.</p></section></div>`;
      }

      function renderStage() {
        const st = $('#stage');
        const keepTop = st.scrollTop;
        st.innerHTML =
          S.view === 'table'
            ? tableHTML()
            : S.view === 'commander'
              ? commanderHTML()
              : S.view === 'record'
                ? recordHTML()
                : standingHTML();
        st.scrollTop = keepTop;
        $$('#stage .call, #stage .report').forEach((el) =>
          seen.add(el.id || el.dataset.key.replace('rep-', '')),
        );
        S.calls.forEach((c) => seen.add(c.id));
        S.reports.forEach((r) => seen.add(r.id));
      }

      function renderBanner() {
        const el = $('#banner');
        if (offline()) {
          el.innerHTML = `<div class="banner" role="status"><div class="grow"><b>Last known state from ${fmt(S.staleSince)}.</b> <span class="muted">You can read everything. Answering, accepting and giving orders waits for the daemon.</span></div><button class="btn" data-act="reconnect">Retry now</button></div>`;
          return;
        }
        if (S.critical && S.view !== 'standing') {
          const c = S.critical;
          el.innerHTML = `<div class="banner red" role="alert"><div class="grow"><span class="label" style="color:var(--red)">Urgent</span><br/><span>${c.observed.map(([k, v]) => `<b>${esc(k)}</b> ${esc(v)}`).join(' · ')}</span></div><div class="actions" style="margin:0">${c.options
            .map((o) => {
              const armed = S.armed && S.armed.id === 'crit' && S.armed.opt === o.key;
              return `<button class="btn ${o.primary ? 'primary' : ''} ${o.danger ? 'danger' : ''} ${armed ? 'armed' : ''}" data-act="crit" data-opt="${o.key}">${esc(armed ? o.confirmLabel : o.label)}</button>`;
            })
            .join('')}</div></div>`;
          return;
        }
        el.innerHTML = '';
      }

      function renderDrawer() {
        const el = $('#drawer');
        if (!S.drawer) {
          el.hidden = true;
          el.innerHTML = '';
          return;
        }
        const wasHidden = el.hidden;
        el.hidden = false;
        el.className = 'drawer';
        const tabs = [
          ['minutes', 'Minutes'],
          ['handled', 'Handled'],
          ['supplies', 'Supplies'],
          ['desk', 'Desk'],
        ];
        if (S.drawer === 'evidence') tabs.push(['evidence', 'Evidence']);
        let body = '';
        if (S.drawer === 'minutes') {
          body =
            S.minutes
              .map((m) =>
                m.k === 'tool'
                  ? `<div class="toolrow">▸ ${esc(m.text)} <span class="ok">ok</span></div>`
                  : `<div class="msg ${m.k === 'you' ? 'you' : ''}"><span class="who">${m.k === 'you' ? 'You' : 'Florina'} · ${fmt(m.t)}</span>${esc(m.text)}</div>`,
              )
              .join('') || '<p class="muted">Nothing said yet.</p>';
        } else if (S.drawer === 'handled') {
          const shown = S.handled.slice(0, 12);
          body =
            `<p class="muted" style="font-size:13px">Problems your commanders solved without bothering you. Each one is in the journal.</p>` +
            shown
              .map(
                (h) =>
                  `<div class="ledger-item"><span>${esc(h.what)}</span><span>${esc(h.did)}</span><span class="meta"><span>${fmt(h.t)}</span><span>${esc((cmdr(h.cmdr) || { name: h.cmdr }).name)}</span><span class="chip">${esc(h.level)}</span><span class="mono">${esc(h.ev)}</span></span></div>`,
              )
              .join('') +
            `<p class="muted" style="font-size:12.5px">Showing the latest ${shown.length} of ${handledToday()}. The full list is in the Record.</p>`;
        } else if (S.drawer === 'supplies') {
          body =
            `<p class="muted" style="font-size:13px">Subscription quota is your fleet’s fuel. Florina routes around dry providers; this is where you see why.</p>` +
            S.supplies
              .map(
                (s) =>
                  `<div class="supply"><div class="head"><span>${esc(s.p)}</span><span>${s.used}% used · ${esc(s.note)}</span></div><div class="bar ${s.used >= 100 ? 'out' : s.used >= 80 ? 'hot' : ''}" role="img" aria-label="${s.used}% used"><i style="width:${s.used}%"></i></div></div>`,
              )
              .join('') +
            `<p class="muted" style="font-size:12.5px">Devin: not connected.</p>`;
        } else if (S.drawer === 'desk') {
          const d = S.desk;
          body = `<div class="desk-sec"><div class="label">Her plan</div><ul>${d.plan.map((x) => `<li>${esc(x)}</li>`).join('')}</ul></div>
            <div class="desk-sec"><div class="label">Researching</div><ul>${d.research.map((x) => `<li>${esc(x)}</li>`).join('')}</ul></div>
            <div class="desk-sec"><div class="label">Waiting for your OK to remember</div>${d.memory.length ? d.memory.map((m) => `<div class="ledger-item"><span>${esc(m.text)}</span><span class="inferred">${esc(m.src)}</span><span class="actions"><button class="btn" data-act="mem" data-id="${m.id}" data-opt="yes">Remember</button><button class="btn ghost" data-act="mem" data-id="${m.id}" data-opt="no">Don’t</button></span></div>`).join('') : '<p class="muted">Nothing pending.</p>'}</div>
            <div class="desk-sec"><div class="label">Context health</div>${d.health.map(([n, v]) => `<div class="supply"><div class="head"><span>${esc(n)}</span><span>${v}% of window</span></div><div class="bar ${v >= 85 ? 'hot' : ''}" role="img" aria-label="${v}% of window"><i style="width:${v}%"></i></div></div>`).join('')}</div>`;
        } else if (S.drawer === 'evidence' && S.drawerFor) {
          const c = S.calls.find((x) => x.id === S.drawerFor) || S.drawerCache;
          if (c)
            body = `<p><b>${esc(c.evidence.claim)}</b></p><div class="prove"><ol>${c.evidence.chain.map(([k, v]) => `<li><b>${esc(k)}</b><span>${esc(v)}</span></li>`).join('')}</ol></div><div class="desk-sec"><div class="label">Rules consulted</div><ul>${c.evidence.rules.map((x) => `<li>${esc(x)}</li>`).join('')}</ul></div><p class="muted" style="font-size:12.5px">Approval level: ${esc(c.authority)}. Observed facts come from the adapter, not from a summary.</p>`;
        }
        el.innerHTML = `<div class="drawer-tabs" role="tablist" aria-label="Side panel">${tabs.map(([k, l]) => `<button role="tab" data-act="drawer" data-id="${k}" aria-selected="${S.drawer === k}" data-key="tab-${k}">${l}</button>`).join('')}<button class="x" data-act="drawer-close" aria-label="Close side panel" data-key="drawer-x">✕</button></div><div class="drawer-body" role="tabpanel">${body}</div>`;
        if (wasHidden) {
          const t = $('[aria-selected="true"]', el);
          if (t) t.focus();
        }
      }

      function renderAddr() {
        const a = S.addressee ? cmdr(S.addressee) : null;
        $('#addr').innerHTML = a
          ? `<span class="addr">To ${esc(a.name)}, via Florina <button type="button" data-act="addr-clear" aria-label="Clear addressee">✕</button></span>`
          : '';
      }

      function renderSheet() {
        const el = $('#sheet');
        const sh = S.sheet;
        if (!sh) {
          el.innerHTML = '';
          return;
        }
        if (sh.type === 'which') {
          el.innerHTML = `<div class="sheet" role="dialog" aria-label="Which front is this for?"><h2>Which front is this for?</h2><p class="muted" style="margin-bottom:12px">I could not tell from “${esc(sh.text)}”. I would rather ask than guess.</p><div class="actions">${S.commanders.map((c, i) => `<button class="btn ${i === 0 ? 'primary' : ''}" data-act="pick-cmdr" data-id="${c.id}" ${i === 0 ? 'data-sheet-first' : ''}>${esc(c.name)}</button>`).join('')}<button class="btn ghost" data-act="sheet-cancel">Cancel</button></div></div>`;
        } else {
          const o = sh.order;
          el.innerHTML = `<div class="sheet" role="dialog" aria-label="Read-back of your order"><h2>Here’s what I understood.</h2><dl class="dl">
            <dt>Outcome</dt><dd>${esc(o.objective)}</dd>
            <dt>Front</dt><dd>${esc(o.cmdr.name)}</dd>
            <dt>Worker</dt><dd>${esc(o.worker)} <span class="inferred">${esc(o.why)}</span></dd>
            <dt>Limits</dt><dd class="chips">${o.limits.map((l) => `<span class="chip">${esc(l)}</span>`).join('')}</dd>
            <dt>Done means</dt><dd>${esc(o.done)}</dd>
            <dt>Because of</dt><dd class="chips">${o.rules.map((r) => `<button type="button" class="chip link" data-act="view" data-id="standing">${r}</button>`).join('')}</dd>
          </dl><div class="actions"><button class="btn primary" data-act="sheet-go" data-sheet-first>Go <kbd>Enter</kbd></button><button class="btn" data-act="sheet-adjust">Adjust</button><button class="btn ghost" data-act="sheet-cancel">Cancel</button></div></div>`;
        }
        const first = $('[data-sheet-first]', el);
        if (first && !el.dataset.focused) {
          first.focus();
          el.dataset.focused = '1';
        }
      }

      function render() {
        const active = document.activeElement;
        const key = active && active.dataset ? active.dataset.key : null;
        renderTabs();
        renderRail();
        renderBanner();
        renderStage();
        renderDrawer();
        renderAddr();
        if (!S.sheet) $('#sheet').dataset.focused = '';
        renderSheet();
        if (key) {
          const n = $(`[data-key="${key}"]`);
          if (n && n !== document.activeElement) n.focus({ preventScroll: true });
        }
        const f = $('#florina');
        if (f) {
          /* voice attribute kept in sync by florinaHTML */
        }
        $('#app').dataset.scenario = S.scenario;
      }

      function announce(msg) {
        $('#live').textContent = '';
        later(() => {
          $('#live').textContent = msg;
        }, 30);
      }

      let toastTimer = null;
      function toast(msg, undo) {
        const el = $('#toast');
        clearTimeout(toastTimer);
        el.innerHTML = `<div class="toast">${esc(msg)}${undo ? '<button class="btn" data-act="undo">Undo</button>' : ''}</div>`;
        el.removeAttribute('aria-hidden');
        S.undo = undo || null;
        announce(msg);
        toastTimer = setTimeout(
          () => {
            el.innerHTML = '';
            S.undo = null;
          },
          undo ? 9000 : 4500,
        );
      }

      /* ===================================================================
       * Actions
       * =================================================================== */
      function say(text) {
        S.minutes.push({ k: 'fl', t: S.clock, text });
      }

      function settleCommanderStatus(id) {
        const c = cmdr(id);
        if (!c) return;
        const stillAwaiting = S.calls.some((x) => x.cmdr === id);
        if (!stillAwaiting && c.status === 'awaiting') {
          c.status = 'advancing';
          c.orders.forEach((o) => {
            if (o.state === 'blocked') {
              o.state = 'running';
              o.note = 'Moving again';
            }
          });
        }
      }

      function resolveCall(id, optKey, fromKbd) {
        if (offline()) return;
        const c = S.calls.find((x) => x.id === id);
        if (!c) return;
        const o = c.options.find((x) => x.key === optKey);
        if (!o) return;
        if (o.widening && !(S.armed && S.armed.id === id && S.armed.opt === optKey)) {
          arm(id, optKey);
          return;
        }
        S.armed = null;
        const snapshot = {
          call: structuredClone(c),
          idx: S.calls.indexOf(c),
          status: cmdr(c.cmdr).status,
          orders: structuredClone(cmdr(c.cmdr).orders),
          recLen: S.record.length,
          minLen: S.minutes.length,
        };
        const el = document.getElementById(id);
        const finish = () => {
          S.calls = S.calls.filter((x) => x.id !== id);
          settleCommanderStatus(c.cmdr);
          S.record.unshift({
            day: 'Today',
            t: S.clock,
            type: 'decision',
            title: `${o.label}: ${c.title.replace(/\?$/, '')}`,
            sub: `${cmdr(c.cmdr).name} · you · ${c.authority}`,
          });
          S.minutes.push({ k: 'you', t: S.clock, text: `${o.label}.` });
          say(o.outcome);
          const nextKey = S.calls[0] ? `call-${S.calls[0].id}` : null;
          render();
          const f = nextKey ? $(`[data-key="${nextKey}"]`) : $('#headline');
          if (f) {
            f.setAttribute('tabindex', f.getAttribute('tabindex') || '-1');
            f.focus({ preventScroll: true });
          }
          toast(o.outcome, () => {
            S.calls.splice(Math.min(snapshot.idx, S.calls.length), 0, snapshot.call);
            const cm = cmdr(c.cmdr);
            cm.status = snapshot.status;
            cm.orders = snapshot.orders;
            S.record.splice(0, S.record.length - snapshot.recLen);
            S.minutes.length = snapshot.minLen;
            seen.delete(id);
            render();
            announce('Undone. The call is back on the Table.');
          });
        };
        if (
          el &&
          !matchMedia('(prefers-reduced-motion: reduce)').matches &&
          !document.documentElement.classList.contains('reduce-motion')
        ) {
          el.classList.add('resolving');
          later(finish, 240);
        } else finish();
      }

      function arm(id, opt) {
        S.armed = { id, opt };
        render();
        announce('Press again to confirm. This widens what is allowed.');
        later(() => {
          if (S.armed && S.armed.id === id && S.armed.opt === opt) {
            S.armed = null;
            render();
          }
        }, 4500);
      }

      function crit(optKey) {
        const c = S.critical;
        if (!c || offline()) return;
        const o = c.options.find((x) => x.key === optKey);
        if (optKey === 'inspect') {
          openInspect({
            evidence: {
              claim: 'Attempted write outside the worktree',
              chain: [
                ['Claim', 'docs-cleanup tried to write ../shared/config.yaml'],
                ['Journal', 'evt_8932 SandboxViolation · 14:40:51'],
                ['Adapter', 'Gemini CLI tool call (structured, tier C)'],
                ['Raw', 'tool call payload · 1 entry'],
              ],
              rules: ['R1 not affected', 'Sandbox policy: worktree only'],
            },
            authority: 'Strong device',
          });
          return;
        }
        if (o.confirm && !(S.armed && S.armed.id === 'crit' && S.armed.opt === optKey)) {
          arm('crit', optKey);
          return;
        }
        S.armed = null;
        const dc = cmdr(c.cmdr);
        if (optKey === 'resume') dc.status = 'advancing';
        if (optKey === 'keep') dc.status = 'paused';
        if (optKey === 'discard') dc.status = 'idle';
        S.critical = null;
        say(o.outcome);
        S.record.unshift({
          day: 'Today',
          t: S.clock,
          type: 'decision',
          title: `${o.label}: docs-cleanup sandbox stop`,
          sub: 'docs-cleanup · you · Strong device',
        });
        render();
        toast(o.outcome);
      }

      function openInspect(call) {
        S.drawerCache = call;
        S.drawer = 'evidence';
        S.drawerFor = call.id || 'x';
        render();
      }

      function acceptReport(id) {
        if (offline()) return;
        const r = S.reports.find((x) => x.id === id);
        if (!r) return;
        const el = $(`[data-key="rep-${id}"]`);
        const done = () => {
          S.reports = S.reports.filter((x) => x.id !== id);
          S.record.unshift({
            day: 'Today',
            t: S.clock,
            type: 'report',
            title: `Accepted: ${r.title.replace(/ is done$/, '')}`,
            sub: `${cmdr(r.cmdr).name} · ${r.evidence[0]}`,
          });
          S.minutes.push({ k: 'you', t: S.clock, text: `Accepted: ${r.title}` });
          render();
          $('#headline') && $('#headline').focus && $('#headline').setAttribute('tabindex', '-1');
          const h = $('#headline');
          if (h) h.focus({ preventScroll: true });
          toast(
            r.group
              ? 'All three accepted. They are in the Record.'
              : 'Accepted. It is in the Record, with its proof.',
          );
        };
        if (
          el &&
          !document.documentElement.classList.contains('reduce-motion') &&
          !matchMedia('(prefers-reduced-motion: reduce)').matches
        ) {
          el.classList.add('resolving');
          later(done, 240);
        } else done();
      }

      /* ---- orders ---- */
      function compile(text) {
        const t = text.toLowerCase();
        const target = S.addressee
          ? cmdr(S.addressee)
          : S.commanders.find((c) => c.aliases.some((a) => new RegExp('\\b' + a + '\\b').test(t)));
        if (!target) return null;
        let worker,
          why,
          rules = ['R1'];
        const codex = S.supplies.find((s) => s.p === 'codex');
        if (/\bclaude\b/.test(t)) {
          worker = 'claude-code';
          why = 'You asked for Claude Code.';
        } else if (/\bcodex\b/.test(t) && codex.used < 100) {
          worker = 'codex';
          why = 'You asked for Codex.';
        } else if (target.id === 'infra') {
          worker = 'codex';
          why = `CI work stays on Codex (R2). It is out until ${fmt(codex.resets)}, so this will wait.`;
          rules.push('R2');
        } else if (codex.used < 90) {
          worker = 'codex';
          why = `Codex has headroom (${codex.used}% used). Your rule R4.`;
          rules.push('R4');
        } else {
          worker = 'claude-code';
          why = `Codex is out until ${fmt(codex.resets)}, so Claude Code. Your rule R4.`;
          rules.push('R4');
        }
        const objective = text
          .trim()
          .replace(/^(please|can you|could you)\s+/i, '')
          .replace(/[.!]$/, '');
        const o = objective.charAt(0).toUpperCase() + objective.slice(1);
        return {
          cmdr: target,
          worker,
          why,
          rules,
          objective: o,
          limits: [
            'No push, merge or deploy',
            'Network: approved hosts only',
            'Edits stay in its worktree',
          ],
          done: 'Tests pass and the build is green. You get a report with the proof attached.',
          title: o.length > 46 ? o.slice(0, 44) + '…' : o,
        };
      }

      function submitOrder(text) {
        text = text.trim();
        if (!text) return;
        if (offline()) {
          toast(
            'The daemon is unreachable. Your order is still in the box; send it when I reconnect.',
          );
          return;
        }
        if (!S.commanders.length) {
          toast('Appoint a commander first. I need to know where your projects live.');
          return;
        }
        $('#order').blur();
        S.voice = 'thinking';
        render();
        later(() => {
          S.voice = 'idle';
          const o = compile(text);
          if (!o) {
            S.sheet = { type: 'which', text };
            render();
            return;
          }
          if (S.readback === 'unsure' && S.addressee) {
            dispatch(o, true);
            $('#order').value = '';
            return;
          }
          S.sheet = { type: 'readback', order: o, text };
          render();
        }, 700);
      }

      function dispatch(o, silent) {
        const c = o.cmdr;
        const id = 'o' + (c.orders.length + 1) + Math.floor(Math.random() * 99);
        const prevStatus = c.status;
        c.orders.push({
          id,
          title: o.title,
          state: 'queued',
          worker: o.worker,
          note: `Briefed to ${o.worker}`,
        });
        if (!['awaiting', 'critical', 'holding', 'paused'].includes(c.status)) c.status = 'briefed';
        if (!c.workers.includes(o.worker)) c.workers.push(o.worker);
        S.sheet = null;
        S.addressee = null;
        S.minutes.push(
          { k: 'you', t: S.clock, text: o.objective + '.' },
          { k: 'tool', t: S.clock, text: `dispatch ${c.name}`, ok: true },
        );
        say(`Understood. ${c.name} has it on ${o.worker}.`);
        S.record.unshift({
          day: 'Today',
          t: S.clock,
          type: 'decision',
          title: `Ordered: ${o.title}`,
          sub: `${c.name} · ${o.worker} · you`,
        });
        $('#order').value = '';
        render();
        toast(`Dispatched to ${c.name} on ${o.worker}.`, () => {
          c.orders = c.orders.filter((x) => x.id !== id);
          c.status = prevStatus;
          render();
          announce('Order withdrawn.');
        });
        later(() => {
          const cc = cmdr(c.id);
          const ord = cc && cc.orders.find((x) => x.id === id);
          if (ord && cc.status === 'briefed') {
            cc.status = 'advancing';
            ord.state = 'running';
            ord.note = 'Working';
            render();
          }
        }, 2400);
      }

      /* ---- speech out: user-initiated only (Catch me up), stops the moment you talk ---- */
      let speakEnd = null;
      function stopSpeaking() {
        try {
          window.speechSynthesis && window.speechSynthesis.cancel();
        } catch (_) {
          /* no speech engine */
        }
        if (speakEnd) speakEnd();
      }
      function speak(text) {
        let ended = false;
        speakEnd = () => {
          if (ended) return;
          ended = true;
          speakEnd = null;
          if (S.voice === 'speaking') {
            S.voice = 'idle';
            render();
          }
        };
        const maxMs = Math.min(14000, 1800 + text.length * 55);
        try {
          if (S.speak && 'speechSynthesis' in window) {
            const u = new SpeechSynthesisUtterance(text);
            u.onend = speakEnd;
            /* no onerror: with no voices installed she stays visibly “speaking” for the timer, so the caption still reads the briefing */ window.speechSynthesis.cancel();
            window.speechSynthesis.speak(u);
          }
        } catch (_) {
          /* fall through to the timer */
        }
        later(() => speakEnd && speakEnd(), maxMs);
      }

      /* ---- voice (simulated) ---- */
      const UTTER =
        'Add cursor pagination to the invoices endpoint in api-pagination, Codex if it is free'.split(
          ' ',
        );
      let voiceTimer = null,
        voiceIdx = 0;
      function voiceStart() {
        if (S.voice === 'listening' || offline()) return;
        stopSpeaking();
        S.voice = 'listening';
        S.caption = '';
        voiceIdx = 0;
        $('#mic').setAttribute('aria-pressed', 'true');
        render();
        voiceTimer = setInterval(() => {
          voiceIdx = Math.min(UTTER.length, voiceIdx + 1);
          S.caption = UTTER.slice(0, voiceIdx).join(' ');
          const c = $('#florina .caption');
          if (c) c.innerHTML = `<b>I’m hearing</b>${esc(S.caption)}`;
        }, 230);
      }
      function voiceStop() {
        if (S.voice !== 'listening') return;
        clearInterval(voiceTimer);
        $('#mic').setAttribute('aria-pressed', 'false');
        S.voice = 'thinking';
        render();
        later(() => {
          S.voice = 'idle';
          const ta = $('#order');
          if (voiceIdx > 0) {
            ta.value =
              (ta.value ? ta.value + ' ' : '') +
              UTTER.slice(0, voiceIdx).join(' ') +
              (voiceIdx === UTTER.length ? '.' : '');
            autosize();
          }
          render();
          ta.focus();
          announce(
            voiceIdx
              ? 'Heard you. The words are in the box. Edit them, then press Enter.'
              : 'I did not catch anything.',
          );
        }, 450);
      }

      /* ---- simulation ---- */
      function tick() {
        S.clock += 1;
        if (offline() || S.firstRun) {
          render();
          return;
        }
        const r = Math.random();
        if (r < 0.62) {
          const h = HANDLED_POOL[Math.floor(Math.random() * HANDLED_POOL.length)];
          fireHandled(h);
        } else if (r < 0.8 && S.simCount.report < REPORT_POOL.length) {
          fireReport();
        } else if (S.simCount.call < CALL_POOL.length) {
          fireCall();
        }
      }
      function fireHandled(h) {
        const c = cmdr(h[0]);
        if (!c) return;
        c.handled += 1;
        S.handledTotal += 1;
        S.handled.unshift({ t: S.clock, cmdr: h[0], what: h[1], did: h[2], level: h[3], ev: h[4] });
        c.chatter = h[2];
        render();
        const seat = $(`[data-key="seat-${c.id}"]`);
        if (seat) {
          seat.classList.add('pulse');
        }
        later(() => {
          if (c.chatter === h[2]) {
            c.chatter = null;
            render();
          }
        }, 5200);
      }
      function fireReport() {
        const r = structuredClone(REPORT_POOL[S.simCount.report]);
        S.simCount.report += 1;
        S.reports.unshift(r);
        const c = cmdr(r.cmdr);
        if (c) {
          const o = c.orders.find((x) => x.state === 'running');
          if (o) {
            o.state = 'verified';
            o.note = 'Verified · report is waiting for you';
          }
        }
        say(`${r.title}: ${r.evidence.slice(0, 2).join(', ')}.`);
        render();
        if (!S.holdCalls) {
          toast(`New report from ${cmdr(r.cmdr).name}: ${r.title}.`);
        }
      }
      function fireCall() {
        const c = structuredClone(CALL_POOL[S.simCount.call]);
        S.simCount.call += 1;
        S.calls.push(c);
        const cm = cmdr(c.cmdr);
        if (cm && cm.status !== 'critical') cm.status = 'awaiting';
        say(`${cm.name} needs your call: ${c.title}`);
        render();
        if (!S.holdCalls) toast(`${cm.name} needs your call.`);
      }
      function setSim(on) {
        S.sim = on;
        clearInterval(simTimer);
        if (on) simTimer = setInterval(tick, 7000);
      }

      /* ---- first run ---- */
      function frScan() {
        S.firstRun.step = 'pick';
        S.firstRun.repos = [
          {
            id: 'a',
            name: 'checkout-refactor',
            path: '~/code/checkout-refactor',
            on: true,
            mono: 'CR',
            objective: 'Not briefed yet',
          },
          {
            id: 'b',
            name: 'api-pagination',
            path: '~/code/api-pagination',
            on: true,
            mono: 'AP',
            objective: 'Not briefed yet',
          },
          {
            id: 'c',
            name: 'docs-cleanup',
            path: '~/code/docs-cleanup',
            on: false,
            mono: 'DC',
            objective: 'Not briefed yet',
          },
        ];
        render();
        announce('Found 3 repositories.');
      }
      function frAppoint() {
        const chosen = S.firstRun.repos.filter((r) => r.on);
        if (!chosen.length) {
          toast('Pick at least one repository.');
          return;
        }
        S.commanders = chosen.map((r) => ({
          id: r.id,
          name: r.name,
          mono: r.mono,
          status: 'idle',
          aliases: [r.name.split('-')[0]],
          objective: r.objective,
          workers: [],
          handled: 0,
          paused: false,
          orders: [],
          record: 'No reports yet',
        }));
        S.firstRun = null;
        S.minutes.push({
          k: 'fl',
          t: S.clock,
          text: `Appointed ${pl(chosen.length, 'commander')}.`,
        });
        render();
        toast(`Appointed ${pl(chosen.length, 'commander')}. Now tell me what you want done.`);
        $('#order').focus();
      }

      /* ===================================================================
       * Events
       * =================================================================== */
      document.addEventListener('click', (e) => {
        const t = e.target.closest('[data-act]');
        if (
          t &&
          t.getAttribute('aria-disabled') === 'true' &&
          !['inspect', 'drawer', 'view'].includes(t.dataset.act)
        ) {
          toast('The daemon is unreachable. I will do this as soon as I am back.');
          return;
        }
        if (!t) {
          const pm = $('#pmenu .pmenu');
          if (pm && !e.target.closest('#pmenu') && e.target.id !== 'protoBtn') closeProto();
          return;
        }
        const id = t.dataset.id,
          act = t.dataset.act;
        switch (act) {
          case 'view':
            S.view = id;
            S.cmdrId = null;
            render();
            $('#stage').scrollTop = 0;
            break;
          case 'open-cmdr':
            S.view = 'commander';
            S.cmdrId = id;
            render();
            {
              const h = $('#cmdr-h');
              if (h) h.focus({ preventScroll: true });
            }
            break;
          case 'resolve':
            resolveCall(id, t.dataset.opt);
            break;
          case 'later': {
            const c = S.calls.find((x) => x.id === id);
            S.calls = S.calls.filter((x) => x.id !== id);
            S.record.unshift({
              day: 'Today',
              t: S.clock,
              type: 'decision',
              title: `Deferred: ${c.title.replace(/\?$/, '')}`,
              sub: 'Comes back at your next briefing · you',
            });
            settleCommanderStatus(c.cmdr);
            render();
            toast('I’ll bring it back at your next briefing.', () => {
              S.calls.unshift(c);
              cmdr(c.cmdr).status = 'awaiting';
              S.record.shift();
              render();
            });
            break;
          }
          case 'inspect':
            openInspect(S.calls.find((x) => x.id === id));
            break;
          case 'accept':
            acceptReport(id);
            break;
          case 'pr':
            toast('Opening the PR in your browser. (Prototype: nothing opens.)');
            break;
          case 'sendback': {
            S.addressee = S.reports.find((x) => x.id === id).cmdr;
            $('#order').value = 'Send back: ';
            renderAddr();
            $('#order').focus();
            toast('Say what is missing. I will relay it to the commander.');
            break;
          }
          case 'prove':
            S.openProof[id] = !S.openProof[id];
            render();
            break;
          case 'drawer':
            S.drawer = S.drawer === id && !t.closest('.drawer-tabs') ? null : id;
            render();
            break;
          case 'drawer-close': {
            const was = S.drawer;
            S.drawer = null;
            render();
            const b = $(`[data-act="drawer"][data-id="${was}"]`);
            if (b) b.focus();
            else $('#order').focus();
            break;
          }
          case 'focus-calls': {
            const z = $('#zone-calls');
            if (z) {
              z.scrollIntoView({ block: 'start' });
              const f = $('[data-nav]', z);
              if (f) f.focus({ preventScroll: true });
            } else if (S.view !== 'table') {
              S.view = 'table';
              render();
            }
            break;
          }
          case 'catchup': {
            const text = `${briefing().head} ${briefing().sub}`;
            S.minutes.push({ k: 'you', t: S.clock, text: 'Catch me up.' });
            say(text);
            S.voice = 'speaking';
            render();
            announce(text);
            speak(text);
            break;
          }
          case 'crit':
            crit(t.dataset.opt);
            break;
          case 'undo':
            if (S.undo) {
              const u = S.undo;
              S.undo = null;
              $('#toast').innerHTML = '';
              u();
            }
            break;
          case 'pause': {
            const c = cmdr(id);
            c.paused = !c.paused;
            if (c.paused) {
              c._prev = c.status;
              c.status = 'paused';
            } else c.status = c._prev || 'advancing';
            render();
            toast(
              c.paused ? `${c.name} is paused. Its worktree is untouched.` : `${c.name} resumed.`,
            );
            break;
          }
          case 'redirect':
            S.addressee = id;
            renderAddr();
            $('#order').focus();
            break;
          case 'override': {
            const c = cmdr(id);
            c.status = 'advancing';
            c.holdReason = '';
            c.workers = ['claude-code'];
            c.orders[0].state = 'running';
            c.orders[0].worker = 'claude-code';
            c.orders[0].note = 'Running on Claude Code (you overrode R2 once)';
            say('Running infra-ci on Claude Code, once. Rule R2 is unchanged.');
            render();
            toast('Running on Claude Code, once. Rule R2 is unchanged.');
            break;
          }
          case 'timeline':
            toast(
              'Opens the existing three-column inspector (tasks, timeline, detail). Not redrawn here.',
            );
            break;
          case 'addr-clear':
            S.addressee = null;
            renderAddr();
            break;
          case 'sheet-go':
            dispatch(S.sheet.order);
            break;
          case 'sheet-adjust':
            $('#order').value = S.sheet.text;
            S.sheet = null;
            render();
            $('#order').focus();
            break;
          case 'sheet-cancel':
            S.sheet = null;
            render();
            $('#order').focus();
            break;
          case 'pick-cmdr':
            S.addressee = id;
            {
              const text = S.sheet.text;
              S.sheet = null;
              const o = compile(text);
              S.addressee = null;
              if (o) {
                S.sheet = { type: 'readback', order: o, text };
              }
              render();
            }
            break;
          case 'recfilter':
            S.recFilter = id;
            render();
            break;
          case 'revoke': {
            const r = S.rules.find((x) => x.id === id);
            S.rules = S.rules.filter((x) => x.id !== id);
            render();
            toast(`${id} revoked. Commanders will ask next time.`, () => {
              S.rules.push(r);
              S.rules.sort((a, b) => a.id.localeCompare(b.id));
              render();
            });
            break;
          }
          case 'mem': {
            S.desk.memory = S.desk.memory.filter((m) => m.id !== id);
            render();
            toast(
              t.dataset.opt === 'yes'
                ? 'Remembered. It shows up in Standing orders.'
                : 'Forgotten. I will not ask again about this.',
            );
            break;
          }
          case 'reconnect': {
            toast('Reconnecting…');
            later(() => {
              S = Object.assign(S, { daemon: 'connected', staleSince: null });
              render();
              toast('Back online. Nothing was lost.');
            }, 900);
            break;
          }
          case 'fr-scan':
            frScan();
            break;
          case 'fr-appoint':
            frAppoint();
            break;
        }
      });

      document.addEventListener('change', (e) => {
        if (e.target.id === 'holdCalls' || e.target.id === 'holdCalls2') {
          S.holdCalls = e.target.checked;
          render();
          announce(
            S.holdCalls
              ? 'Holding your calls. Only urgent things will interrupt.'
              : 'Calls are back on.',
          );
        }
        if (e.target.id === 'readback') S.readback = e.target.value;
        if (e.target.id === 'speakT') S.speak = e.target.checked;
        if (e.target.dataset && e.target.dataset.repo) {
          const r = S.firstRun.repos.find((x) => x.id === e.target.dataset.repo);
          r.on = e.target.checked;
          render();
        }
      });
      document.addEventListener('input', (e) => {
        if (e.target.id === 'recq') {
          S.recQuery = e.target.value;
          const pos = e.target.selectionStart;
          renderStage();
          const n = $('#recq');
          n.focus();
          n.setSelectionRange(pos, pos);
        }
      });

      const ta = $('#order');
      function autosize() {
        ta.style.height = 'auto';
        ta.style.height = Math.min(120, ta.scrollHeight) + 'px';
      }
      ta.addEventListener('input', autosize);
      ta.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          $('#orderForm').requestSubmit();
        }
      });
      $('#orderForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const v = ta.value;
        if (!v.trim()) return;
        submitOrder(v);
      });
      $('#mic').addEventListener('click', () => {
        S.voice === 'listening' ? voiceStop() : voiceStart();
      });
      $('#appointBtn').addEventListener('click', () => {
        if (offline()) return;
        S.view = 'table';
        S.firstRun = S.commanders.length ? null : S.firstRun;
        toast(
          'Opens the folder picker, then appoints a commander. (Prototype: see the First run scenario.)',
        );
      });

      /* prototype menu */
      function closeProto() {
        $('#pmenu').innerHTML = '';
        $('#protoBtn').setAttribute('aria-expanded', 'false');
      }
      $('#protoBtn').addEventListener('click', () => {
        if ($('#pmenu .pmenu')) {
          closeProto();
          return;
        }
        $('#protoBtn').setAttribute('aria-expanded', 'true');
        const sc = [
          ['morning', 'Busy morning (2 calls, 2 reports)'],
          ['quiet', 'All quiet'],
          ['critical', 'Critical: sandbox stop'],
          ['offline', 'Daemon offline'],
          ['firstrun', 'First run'],
        ];
        $('#pmenu').innerHTML =
          `<div class="pmenu" role="dialog" aria-label="Prototype controls"><div class="label">Prototype only</div>${sc.map(([k, l]) => `<label class="opt-row"><input type="radio" name="sc" value="${k}" ${S.scenario === k ? 'checked' : ''}/> ${l}</label>`).join('')}<label class="opt-row"><input type="checkbox" id="simT" ${S.sim ? 'checked' : ''}/> Simulate live events</label><label class="opt-row"><input type="checkbox" id="rmT" ${document.documentElement.classList.contains('reduce-motion') ? 'checked' : ''}/> Preview reduced motion</label><p>Everything here is fixtures. No daemon, no network. Press Esc to close.</p></div>`;
        $('#pmenu input[name=sc]:checked').focus();
      });
      document.addEventListener('change', (e) => {
        if (e.target.name === 'sc') {
          timers.forEach(clearTimeout);
          timers.clear();
          clearInterval(voiceTimer);
          const sim = S.sim;
          S = loadScenario(e.target.value);
          S.sim = sim;
          seen.clear();
          render();
          announce('Scenario: ' + e.target.value);
        }
        if (e.target.id === 'simT') setSim(e.target.checked);
        if (e.target.id === 'rmT')
          document.documentElement.classList.toggle('reduce-motion', e.target.checked);
      });

      /* keyboard */
      let gPending = false;
      function typing(t) {
        return t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT');
      }
      function navList() {
        return [...$$('#stage [data-nav]'), ...$$('#railList [data-nav]')];
      }
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Tab' && $('#overlay .overlay')) {
          e.preventDefault();
          const b = $('#helpClose');
          if (b) b.focus();
          return;
        }
        if (e.key === 'Escape') {
          if ($('#overlay .overlay')) {
            $('#overlay').innerHTML = '';
            ta.focus();
            return;
          }
          if ($('#pmenu .pmenu')) {
            closeProto();
            $('#protoBtn').focus();
            return;
          }
          if (S.sheet) {
            S.sheet = null;
            render();
            ta.focus();
            return;
          }
          if (S.voice === 'speaking') {
            stopSpeaking();
            return;
          }
          if (S.drawer) {
            const was = S.drawer;
            S.drawer = null;
            render();
            const b = $(`[data-act="drawer"][data-id="${was}"]`);
            (b || ta).focus();
            return;
          }
          if (S.view === 'commander') {
            const id = S.cmdrId;
            S.view = 'table';
            S.cmdrId = null;
            render();
            const b = $(`[data-key="seat-${id}"]`);
            if (b) b.focus();
            return;
          }
          if (typing(e.target)) e.target.blur();
          return;
        }
        if (
          e.key === ' ' &&
          !e.repeat &&
          !typing(e.target) &&
          (e.target === document.body || e.target.id === 'mic') &&
          !e.target.closest('button:not(#mic)')
        ) {
          e.preventDefault();
          voiceStart();
          return;
        }
        if (typing(e.target) || e.metaKey || e.ctrlKey || e.altKey) return;
        if (gPending) {
          gPending = false;
          const map = { t: 'table', r: 'record', s: 'standing' };
          if (map[e.key]) {
            S.view = map[e.key];
            S.cmdrId = null;
            render();
          }
          return;
        }
        switch (e.key) {
          case 'g':
            gPending = true;
            later(() => {
              gPending = false;
            }, 1200);
            break;
          case 'j':
          case 'k': {
            const l = navList();
            if (!l.length) break;
            const i = l.indexOf(document.activeElement);
            const n =
              e.key === 'j' ? Math.min(l.length - 1, i + 1) : Math.max(0, i === -1 ? 0 : i - 1);
            l[n].focus();
            l[n].scrollIntoView({ block: 'nearest' });
            break;
          }
          case 'Enter': {
            const a = document.activeElement;
            if (a && a.matches && a.matches('article[data-nav]')) {
              const p = $('[data-primary]', a);
              if (p) {
                e.preventDefault();
                p.click();
              }
            }
            break;
          }
          case 'o':
          case '/':
            e.preventDefault();
            ta.focus();
            break;
          case '1':
            S.drawer = S.drawer === 'minutes' ? null : 'minutes';
            render();
            break;
          case '2':
            S.drawer = S.drawer === 'handled' ? null : 'handled';
            render();
            break;
          case '3':
            S.drawer = S.drawer === 'supplies' ? null : 'supplies';
            render();
            break;
          case '4':
            S.drawer = S.drawer === 'desk' ? null : 'desk';
            render();
            break;
          case '?':
            $('#overlay').innerHTML =
              `<div class="overlay" role="dialog" aria-label="Keyboard shortcuts" aria-modal="true"><div class="modal"><h2>Keyboard</h2><div class="keys"><kbd>Hold Space</kbd><span>Talk to Florina</span><kbd>o</kbd><span>Write an order</span><kbd>j</kbd> <span>Next card or commander (<kbd>k</kbd> back)</span><kbd>Enter</kbd><span>Primary action of the focused card</span><kbd>g t</kbd><span>The Table</span><kbd>g r</kbd><span>Record</span><kbd>g s</kbd><span>Standing orders</span><kbd>1 2 3 4</kbd><span>Minutes, Handled, Supplies, Desk</span><kbd>Esc</kbd><span>Back out one level</span></div><div class="actions" style="margin-top:16px"><button class="btn primary" id="helpClose">Close</button></div></div></div>`;
            $('#helpClose').focus();
            $('#helpClose').addEventListener('click', () => {
              $('#overlay').innerHTML = '';
            });
            break;
        }
      });
      document.addEventListener('keyup', (e) => {
        if (e.key === ' ' && S.voice === 'listening') {
          e.preventDefault();
          voiceStop();
        }
      });

      /* test + demo hooks (prototype only) */
      window.__war = {
        get state() {
          return S;
        },
        tick,
        fireHandled: () => fireHandled(HANDLED_POOL[0]),
        fireReport,
        fireCall,
        load: (n) => {
          S = loadScenario(n);
          seen.clear();
          render();
        },
        setSim,
        briefing,
      };

      render();
      setSim(S.sim);
    </script>
  </body>
</html>
