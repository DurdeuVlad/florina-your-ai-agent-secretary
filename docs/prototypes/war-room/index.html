<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Florina — The Table (prototype)</title>
    <style>
      /* =====================================================================
       * Florina "The Table" — disposable interactive prototype.
       * Spec: docs/WAR_ROOM_UX.md. Tokens are the DG-01 tokens verbatim
       * (src/adapters/inbound/desktop/renderer/tokens.css); only the layout
       * variables under "prototype layout" are new. Everything here is
       * simulated: no daemon, no network, fixtures only.
       * ===================================================================== */
      :root {
        --bg: #0e0a16;
        --surface: #151022;
        --panel: #1d1730;
        --panel-raised: #261e3f;
        --border: #342b4e;
        --border-hover: #4a3d6e;
        --text: #eeecf5;
        --muted: #9b93b3;
        --accent: #a98af0;
        --accent-contrast: #1a1028;
        --green: #3fb984;
        --amber: #e3a94a;
        --red: #ef5959;
        --orange: #e2814f;
        --slate: #847d99;

        --radius-sm: 6px;
        --radius-md: 10px;
        --radius-lg: 14px;
        --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.45);
        --shadow-lg: 0 16px 48px rgba(0, 0, 0, 0.55);
        --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
        --dur-fast: 120ms;
        --dur-base: 180ms;
        --dur-slow: 260ms;

        /* prototype layout */
        --rail-w: 296px;
        --drawer-w: 360px;
        --topbar-h: 48px;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        height: 100%;
      }
      body {
        font:
          14px/1.55 -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        background: var(--bg);
        color: var(--text);
        -webkit-font-smoothing: antialiased;
        overflow: hidden;
      }
      [hidden] {
        display: none !important;
      }
      button {
        font: inherit;
        color: inherit;
        background: none;
        border: 0;
        cursor: pointer;
        text-align: inherit;
      }
      button[aria-disabled='true'] {
        cursor: not-allowed;
        opacity: 0.5;
      }
      input,
      textarea,
      select {
        font: inherit;
        color: var(--text);
      }
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
        border-radius: var(--radius-sm);
      }
      .sr {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }
      .mono {
        font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
        font-size: 12.5px;
      }
      .muted {
        color: var(--muted);
      }
      .inferred {
        color: var(--muted);
        font-style: italic;
      }

      /* ---------- shell ---------- */
      .app {
        position: relative;
        display: grid;
        height: 100vh;
        grid-template-columns: var(--rail-w) minmax(0, 1fr);
        grid-template-rows: var(--topbar-h) minmax(0, 1fr) auto;
        grid-template-areas:
          'top top'
          'rail main'
          'bar bar';
      }
      .topbar {
        grid-area: top;
        display: flex;
        align-items: center;
        gap: 24px;
        padding: 0 20px;
        background: var(--surface);
        border-bottom: 1px solid var(--border);
      }
      .logo {
        font-size: 16px;
        font-weight: 650;
        letter-spacing: -0.1px;
        width: calc(var(--rail-w) - 40px);
      }
      .logo em {
        color: var(--accent);
        font-style: normal;
      }
      .tabs {
        display: flex;
        gap: 4px;
        height: 100%;
      }
      .tab {
        display: flex;
        align-items: center;
        padding: 0 12px;
        color: var(--muted);
        font-weight: 500;
        border-bottom: 2px solid transparent;
        transition: color var(--dur-fast) var(--ease);
      }
      .tab:hover {
        color: var(--text);
      }
      .tab[aria-current='page'] {
        color: var(--text);
        border-bottom-color: var(--accent);
      }
      .topbar .spacer {
        flex: 1;
      }
      .daemon {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        color: var(--muted);
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--slate);
        flex: none;
      }
      .dot.on {
        background: var(--green);
      }
      .dot.wait {
        background: var(--amber);
      }
      .dot.err {
        background: var(--red);
      }
      .proto-btn {
        font-size: 11.5px;
        font-weight: 600;
        letter-spacing: 0.4px;
        color: var(--muted);
        border: 1px dashed var(--border-hover);
        border-radius: var(--radius-sm);
        padding: 3px 10px;
      }
      .proto-btn:hover {
        color: var(--text);
      }

      /* ---------- commander rail ---------- */
      .rail {
        grid-area: rail;
        background: var(--surface);
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      .rail-head {
        padding: 16px 20px 8px;
      }
      .label {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 1.2px;
        text-transform: uppercase;
        color: var(--muted);
      }
      .rail-head .hint {
        font-size: 12px;
        color: var(--muted);
        margin-top: 2px;
      }
      .rail-list {
        flex: 1;
        overflow-y: auto;
        padding: 4px 8px 8px;
      }
      .seat {
        position: relative;
        display: flex;
        gap: 12px;
        width: 100%;
        padding: 12px 12px 12px 14px;
        border-radius: var(--radius-md);
        border-left: 3px solid transparent;
        transition: background-color var(--dur-fast) var(--ease);
      }
      .seat + .seat {
        margin-top: 2px;
      }
      .seat:hover {
        background: var(--panel);
      }
      .seat.sel {
        background: var(--panel-raised);
      }
      .seat.awaiting {
        border-left-color: var(--amber);
      }
      .seat.critical {
        border-left-color: var(--red);
      }
      .seat.holding {
        border-left-color: var(--amber);
        border-left-style: dashed;
      }
      .mono-badge {
        flex: none;
        width: 32px;
        height: 32px;
        border-radius: var(--radius-md);
        background: var(--panel-raised);
        border: 1px solid var(--border);
        color: var(--accent);
        font-size: 11.5px;
        font-weight: 700;
        letter-spacing: 0.4px;
        display: grid;
        place-items: center;
      }
      .seat-main {
        display: flex;
        flex-direction: column;
        gap: 2px;
        min-width: 0;
        flex: 1;
      }
      .seat-top {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        align-items: baseline;
      }
      .seat-name {
        font-weight: 600;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .seat-status {
        font-size: 11.5px;
        font-weight: 600;
        color: var(--muted);
        white-space: nowrap;
      }
      .seat-status.amber {
        color: var(--amber);
      }
      .seat-status.red {
        color: var(--red);
      }
      .seat-obj {
        font-size: 12.5px;
        color: var(--muted);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .seat-obj.chatter {
        color: var(--green);
      }
      .seat-prog {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 4px;
        min-width: 0;
      }
      .segs {
        display: flex;
        gap: 3px;
        flex: none;
      }
      .seg {
        width: 14px;
        height: 4px;
        border-radius: 2px;
        background: var(--border);
      }
      .seg.verified {
        background: var(--green);
      }
      .seg.running {
        background: var(--accent);
      }
      .seg.blocked {
        background: var(--amber);
      }
      .seat-count {
        font-size: 11.5px;
        color: var(--muted);
        white-space: nowrap;
      }
      .seat-foot {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-top: 4px;
      }
      .seat-handled {
        margin-left: auto;
        flex: none;
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font-size: 11.5px;
        color: var(--muted);
      }
      .seat-handled svg {
        color: var(--green);
      }
      .rail-list.ritual .seat {
        animation: enter var(--dur-slow) var(--ease) backwards;
        animation-delay: calc(var(--i) * 70ms);
      }
      .seat.pulse {
        animation: seat-pulse 700ms var(--ease) 1;
      }
      @keyframes seat-pulse {
        from {
          background: var(--panel-raised);
        }
        to {
          background: transparent;
        }
      }
      .rail-foot {
        padding: 8px 12px 12px;
        border-top: 1px solid var(--border);
      }

      /* ---------- main stage ---------- */
      .main {
        grid-area: main;
        position: relative;
        min-width: 0;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }
      .stage {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding: 0 32px 24px;
      }
      .stage > * {
        max-width: 1040px;
      }
      .banner {
        margin: 16px 32px 0;
        max-width: 1040px;
        border: 1px solid var(--border);
        border-left: 3px solid var(--amber);
        border-radius: var(--radius-lg);
        background: var(--panel);
        padding: 12px 16px;
        display: flex;
        gap: 16px;
        align-items: center;
        flex-wrap: wrap;
      }
      .banner.red {
        border-left-color: var(--red);
        animation: alert-in 260ms var(--ease) 1;
      }
      .banner .grow {
        flex: 1;
        min-width: 220px;
      }
      .banner b {
        font-weight: 650;
      }
      @keyframes alert-in {
        from {
          opacity: 0;
          transform: translateY(-6px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

      /* Florina's seat — the briefing. No card chrome: the headline is the
         single focal point (hierarchy rule: contrast, then weight, then size). */
      .florina {
        display: grid;
        grid-template-columns: 64px minmax(0, 1fr) auto;
        gap: 20px;
        align-items: start;
        padding: 28px 0 20px;
        border-bottom: 1px solid var(--border);
      }
      .orb {
        width: 64px;
        height: 64px;
        color: var(--accent);
      }
      .orb .ring {
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        opacity: 0.35;
        transform-origin: 32px 32px;
      }
      .orb .core {
        fill: currentColor;
        opacity: 0.9;
      }
      .orb .bars {
        opacity: 0;
      }
      .orb .bars rect {
        fill: var(--accent-contrast);
        transform-box: fill-box;
        transform-origin: center;
      }
      [data-voice='listening'] .orb .bars {
        opacity: 1;
      }
      [data-voice='listening'] .orb .bars rect {
        animation: bar 700ms ease-in-out infinite alternate;
      }
      [data-voice='listening'] .orb .bars rect:nth-child(2) {
        animation-delay: 120ms;
      }
      [data-voice='listening'] .orb .bars rect:nth-child(3) {
        animation-delay: 240ms;
      }
      [data-voice='listening'] .orb .bars rect:nth-child(4) {
        animation-delay: 60ms;
      }
      [data-voice='listening'] .orb .ring {
        opacity: 0.9;
        animation: ring 1.4s ease-in-out infinite;
      }
      [data-voice='thinking'] .orb .ring {
        opacity: 0.9;
        stroke-dasharray: 22 130;
        animation: spin 1.1s linear infinite;
      }
      [data-voice='speaking'] .orb .ring {
        opacity: 0.8;
        animation: ring 1s ease-in-out infinite;
      }
      [data-tone='amber'] .orb {
        color: var(--amber);
      }
      [data-tone='red'] .orb {
        color: var(--red);
      }
      [data-tone='slate'] .orb {
        color: var(--slate);
      }
      @keyframes bar {
        from {
          transform: scaleY(0.35);
        }
        to {
          transform: scaleY(1);
        }
      }
      @keyframes ring {
        50% {
          transform: scale(1.08);
          opacity: 0.45;
        }
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .florina .state {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 1.2px;
        text-transform: uppercase;
        color: var(--muted);
      }
      .florina h1 {
        font-size: 28px;
        line-height: 1.2;
        font-weight: 650;
        letter-spacing: -0.4px;
        margin: 4px 0 6px;
        text-wrap: balance;
      }
      .florina .sub {
        color: var(--muted);
        max-width: 64ch;
      }
      .florina .copy {
        min-height: 118px;
      }
      .florina .caption {
        border-left: 2px solid var(--accent);
        padding-left: 10px;
        font-style: italic;
      }
      .florina .caption b {
        color: var(--accent);
        font-style: normal;
        font-weight: 600;
        margin-right: 6px;
      }
      .florina .tools {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 8px;
        padding-top: 4px;
      }
      .switch {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 12.5px;
        color: var(--muted);
        cursor: pointer;
      }
      .switch input {
        position: absolute;
        opacity: 0;
        width: 1px;
        height: 1px;
      }
      .switch .track {
        width: 32px;
        height: 18px;
        border-radius: 9px;
        background: var(--panel-raised);
        border: 1px solid var(--border);
        position: relative;
        transition: background-color var(--dur-fast) var(--ease);
      }
      .switch .track::after {
        content: '';
        position: absolute;
        top: 2px;
        left: 2px;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: var(--muted);
        transition:
          transform var(--dur-fast) var(--ease),
          background-color var(--dur-fast) var(--ease);
      }
      .switch input:checked + .track {
        background: var(--panel);
        border-color: var(--accent);
      }
      .switch input:checked + .track::after {
        transform: translateX(14px);
        background: var(--accent);
      }
      .switch input:focus-visible + .track {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .strip {
        grid-column: 2 / 4;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 4px;
      }
      .stat {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 3px 12px;
        border-radius: 14px;
        border: 1px solid var(--border);
        font-size: 12.5px;
        color: var(--muted);
        transition:
          border-color var(--dur-fast) var(--ease),
          color var(--dur-fast) var(--ease);
      }
      .stat:hover {
        border-color: var(--border-hover);
        color: var(--text);
      }
      .stat b {
        color: var(--text);
        font-weight: 650;
      }
      .stat.amber b {
        color: var(--amber);
      }
      .stat[aria-expanded='true'] {
        border-color: var(--accent);
        color: var(--text);
      }

      /* ---------- table zones ---------- */
      .zones {
        display: grid;
        grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr);
        gap: 32px;
        padding-top: 20px;
        align-items: start;
      }
      .zone-head {
        display: flex;
        align-items: baseline;
        gap: 8px;
        margin-bottom: 12px;
      }
      .zone-head .n {
        font-size: 12px;
        color: var(--muted);
      }
      .zone-head .more {
        margin-left: auto;
        font-size: 12px;
        color: var(--muted);
      }
      .stack {
        display: grid;
        gap: 12px;
      }
      .calm-feed {
        padding-top: 24px;
        max-width: 720px;
      }
      .zone-head button.more {
        color: var(--accent);
        font-weight: 600;
      }
      .calm {
        padding: 24px 0;
      }
      .calm .big {
        font-size: 16px;
        font-weight: 600;
      }
      .calm .hint {
        color: var(--muted);
        font-size: 13px;
        margin-top: 2px;
        max-width: 48ch;
      }

      /* decision card — the hero component */
      .call {
        position: relative;
        background: var(--panel);
        border: 1px solid var(--border);
        border-left: 3px solid var(--accent);
        border-radius: var(--radius-lg);
        padding: 16px 18px 16px 16px;
        display: grid;
        gap: 10px;
        transition: border-color var(--dur-fast) var(--ease);
      }
      .call.Critical {
        border-left-color: var(--red);
      }
      .call.High {
        border-left-color: var(--amber);
      }
      .call.Low {
        border-left-color: var(--slate);
      }
      .call:hover {
        border-color: var(--border-hover);
      }
      .call:focus-visible,
      .report:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
        border-radius: var(--radius-lg);
      }
      .call .top {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 4px 10px;
        font-size: 12.5px;
        color: var(--muted);
      }
      .call .top .kind {
        font-weight: 650;
      }
      .call.High .kind {
        color: var(--amber);
      }
      .call.Critical .kind {
        color: var(--red);
      }
      .call .top .when {
        margin-left: auto;
      }
      .call h3 {
        font-size: 16px;
        line-height: 1.35;
        font-weight: 600;
      }
      .reco {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        padding: 10px 12px;
        font-size: 13px;
      }
      .reco b {
        font-weight: 650;
      }
      .reco .why {
        display: block;
        margin-top: 2px;
        color: var(--muted);
        font-style: italic;
      }
      .observed {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 16px;
        font-size: 12.5px;
      }
      .observed span b {
        font-weight: 600;
        color: var(--muted);
        margin-right: 4px;
      }
      .blocking {
        font-size: 12.5px;
        color: var(--muted);
      }
      .blocking::before {
        content: '';
        display: inline-block;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--amber);
        margin-right: 8px;
        vertical-align: 1px;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 2px;
      }
      .btn {
        min-height: 32px;
        padding: 4px 14px;
        border-radius: var(--radius-md);
        font-size: 13px;
        font-weight: 600;
        background: var(--panel-raised);
        border: 1px solid var(--border);
        transition:
          border-color var(--dur-fast) var(--ease),
          filter var(--dur-fast) var(--ease);
      }
      .btn:hover:not([aria-disabled='true']) {
        border-color: var(--border-hover);
        filter: brightness(1.12);
      }
      .btn.primary {
        background: var(--accent);
        color: var(--accent-contrast);
        border-color: var(--accent);
      }
      .btn.ghost {
        background: transparent;
      }
      .btn.danger {
        color: var(--red);
        border-color: var(--red);
        background: transparent;
      }
      .btn.armed {
        background: var(--amber);
        border-color: var(--amber);
        color: var(--accent-contrast);
      }
      .btn kbd {
        font: inherit;
        font-size: 11px;
        background: transparent;
        border-color: currentColor;
        color: inherit;
        margin-left: 8px;
        line-height: 1.4;
      }
      .opts {
        display: grid;
        gap: 8px;
      }
      .opt {
        display: grid;
        gap: 0;
        padding: 8px 12px;
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        background: var(--panel-raised);
      }
      .opt:hover:not([aria-disabled='true']) {
        border-color: var(--border-hover);
      }
      .opt.reco-pick {
        border-color: var(--accent);
      }
      .opt .l {
        font-weight: 600;
        font-size: 13px;
      }
      .opt .d {
        font-size: 12.5px;
        color: var(--muted);
      }
      .opt .tag {
        color: var(--accent);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.6px;
        text-transform: uppercase;
        margin-left: 8px;
      }
      .resolving {
        animation: resolve 260ms var(--ease) forwards;
        overflow: hidden;
      }
      @keyframes resolve {
        to {
          opacity: 0;
          transform: translateX(12px);
          max-height: 0;
          padding-top: 0;
          padding-bottom: 0;
          margin-bottom: -12px;
        }
      }
      .enter {
        animation: enter var(--dur-slow) var(--ease) 1;
      }
      @keyframes enter {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

      /* reports — flatter than decisions: they ask less of you */
      .report {
        border-top: 1px solid var(--border);
        padding: 14px 0;
        display: grid;
        gap: 6px;
      }
      .report:first-of-type {
        border-top: 0;
        padding-top: 0;
      }
      .report .top {
        display: flex;
        gap: 8px;
        align-items: baseline;
        font-size: 12.5px;
        color: var(--muted);
      }
      .report .top .done {
        color: var(--green);
        font-weight: 650;
      }
      .report h3 {
        font-size: 15px;
        font-weight: 600;
        line-height: 1.35;
      }
      .evidence {
        font-size: 13px;
      }
      .evidence .ok {
        color: var(--green);
        font-weight: 650;
      }
      .risk {
        font-size: 12.5px;
        color: var(--amber);
      }
      .along {
        font-size: 12.5px;
        color: var(--muted);
      }
      .prove {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        padding: 10px 12px;
        font-size: 12.5px;
      }
      .prove ol {
        list-style: none;
        display: grid;
        gap: 6px;
      }
      .prove li {
        display: grid;
        grid-template-columns: 78px 1fr;
        gap: 8px;
      }
      .prove li b {
        color: var(--muted);
        font-weight: 600;
      }

      /* chips */
      .chip {
        font-size: 11px;
        font-weight: 600;
        padding: 1px 9px;
        border-radius: 10px;
        border: 1px solid var(--border);
        color: var(--muted);
        white-space: nowrap;
      }
      .chip.Critical {
        color: var(--red);
        border-color: var(--red);
      }
      .chip.High {
        color: var(--amber);
        border-color: var(--amber);
      }
      .chip.Medium {
        color: var(--accent);
        border-color: var(--accent);
      }
      .chip.green {
        color: var(--green);
        border-color: var(--green);
      }
      .chip.link {
        cursor: pointer;
      }

      /* ---------- commander view ---------- */
      .crumbs {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 20px 0 4px;
        font-size: 13px;
        color: var(--muted);
      }
      .crumbs button {
        color: var(--accent);
        font-weight: 600;
      }
      .cmdr-title {
        display: flex;
        align-items: baseline;
        gap: 12px;
        flex-wrap: wrap;
        margin: 4px 0 4px;
      }
      .cmdr-title h1 {
        font-size: 24px;
        font-weight: 650;
        letter-spacing: -0.3px;
      }
      .cmdr-grid {
        display: grid;
        grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr);
        gap: 32px;
        margin-top: 24px;
        align-items: start;
      }
      .rows {
        display: grid;
      }
      .row {
        display: grid;
        grid-template-columns: 18px minmax(0, 1fr) auto;
        gap: 10px;
        padding: 10px 0;
        border-top: 1px solid var(--border);
        font-size: 13.5px;
        align-items: start;
      }
      .row:first-child {
        border-top: 0;
      }
      .row .glyph {
        font-size: 13px;
        line-height: 1.55;
      }
      .row .glyph.verified {
        color: var(--green);
      }
      .row .glyph.running {
        color: var(--accent);
      }
      .row .glyph.blocked {
        color: var(--amber);
      }
      .row .glyph.queued {
        color: var(--slate);
      }
      .row .sub {
        display: block;
        font-size: 12.5px;
        color: var(--muted);
      }
      .row .when {
        font-size: 12px;
        color: var(--muted);
        white-space: nowrap;
      }

      /* ---------- order bar ---------- */
      .orderbar {
        grid-area: bar;
        background: var(--surface);
        border-top: 1px solid var(--border);
        padding: 12px 20px 10px;
        position: relative;
        z-index: 3;
      }
      .orderbar .line {
        display: flex;
        gap: 12px;
        align-items: flex-end;
        max-width: 1160px;
      }
      .addr {
        position: absolute;
        top: -14px;
        left: 24px;
        background: var(--panel-raised);
        border: 1px solid var(--accent);
        color: var(--text);
        border-radius: 12px;
        font-size: 12px;
        padding: 1px 6px 1px 12px;
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .addr button {
        color: var(--muted);
        padding: 0 4px;
      }
      .mic {
        flex: none;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: var(--accent);
        color: var(--accent-contrast);
        display: grid;
        place-items: center;
        transition: filter var(--dur-fast) var(--ease);
      }
      .mic:hover {
        filter: brightness(1.1);
      }
      .mic[aria-pressed='true'] {
        box-shadow: 0 0 0 4px rgba(169, 138, 240, 0.28);
      }
      .field {
        flex: 1;
        min-width: 0;
      }
      .field textarea {
        width: 100%;
        resize: none;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        padding: 10px 12px;
        min-height: 44px;
        max-height: 120px;
        display: block;
      }
      .field textarea:focus {
        outline: none;
        border-color: var(--accent);
      }
      .field textarea::placeholder {
        color: var(--muted);
      }
      .orderbar .hint {
        margin-top: 6px;
        font-size: 11.5px;
        color: var(--muted);
        display: flex;
        gap: 16px;
        flex-wrap: wrap;
      }
      kbd {
        font-family: ui-monospace, Menlo, Consolas, monospace;
        font-size: 11px;
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 0 5px;
        background: var(--panel);
      }

      /* read-back sheet */
      .sheet {
        position: absolute;
        left: 32px;
        right: 32px;
        bottom: 12px;
        max-width: 760px;
        background: var(--panel-raised);
        border: 1px solid var(--border-hover);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-md);
        padding: 16px 18px;
        z-index: 5;
        animation: enter var(--dur-slow) var(--ease) 1;
      }
      .sheet h2 {
        font-size: 15px;
        font-weight: 650;
        margin-bottom: 10px;
      }
      .dl {
        display: grid;
        grid-template-columns: 96px minmax(0, 1fr);
        gap: 6px 14px;
        font-size: 13.5px;
        margin-bottom: 14px;
      }
      .dl dt {
        color: var(--muted);
        font-size: 12.5px;
        padding-top: 1px;
      }
      .dl .chips {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }

      /* ---------- drawer ---------- */
      .drawer {
        position: absolute;
        top: var(--topbar-h);
        right: 0;
        bottom: 0;
        width: var(--drawer-w);
        background: var(--surface);
        border-left: 1px solid var(--border);
        box-shadow: var(--shadow-lg);
        display: flex;
        flex-direction: column;
        z-index: 6;
        animation: drawer-in var(--dur-base) var(--ease) 1;
      }
      @keyframes drawer-in {
        from {
          transform: translateX(24px);
          opacity: 0;
        }
        to {
          transform: none;
          opacity: 1;
        }
      }
      .drawer-tabs {
        display: flex;
        border-bottom: 1px solid var(--border);
        padding: 0 8px;
      }
      .drawer-tabs button {
        padding: 12px 10px 10px;
        font-size: 12.5px;
        font-weight: 600;
        color: var(--muted);
        border-bottom: 2px solid transparent;
      }
      .drawer-tabs button[aria-selected='true'] {
        color: var(--text);
        border-bottom-color: var(--accent);
      }
      .drawer-tabs .x {
        margin-left: auto;
        font-size: 16px;
        padding: 8px 10px;
      }
      .drawer-body {
        flex: 1;
        overflow-y: auto;
        padding: 16px;
        display: grid;
        gap: 14px;
        align-content: start;
      }
      .msg {
        max-width: 92%;
        padding: 8px 12px;
        border-radius: var(--radius-lg);
        font-size: 13px;
        border: 1px solid var(--border);
        background: var(--panel);
      }
      .msg.you {
        justify-self: end;
        background: var(--panel-raised);
      }
      .msg .who {
        display: block;
        font-size: 10.5px;
        font-weight: 700;
        letter-spacing: 0.8px;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 2px;
      }
      .toolrow {
        font-family: ui-monospace, Menlo, Consolas, monospace;
        font-size: 12px;
        color: var(--muted);
        border-left: 2px solid var(--border);
        padding: 2px 10px;
      }
      .toolrow .ok {
        color: var(--green);
      }
      .ledger-item {
        display: grid;
        gap: 2px;
        font-size: 13px;
        padding-bottom: 12px;
        border-bottom: 1px solid var(--border);
      }
      .ledger-item .meta {
        font-size: 12px;
        color: var(--muted);
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .bar {
        height: 6px;
        background: var(--panel-raised);
        border-radius: 3px;
        overflow: hidden;
      }
      .bar i {
        display: block;
        height: 100%;
        background: var(--accent);
      }
      .bar.hot i {
        background: var(--amber);
      }
      .bar.out i {
        background: var(--red);
      }
      .supply {
        display: grid;
        gap: 6px;
      }
      .supply .head {
        display: flex;
        justify-content: space-between;
        font-size: 13px;
      }
      .supply .head span:last-child {
        color: var(--muted);
        font-size: 12px;
      }
      .desk-sec {
        display: grid;
        gap: 6px;
      }
      .desk-sec ul {
        list-style: none;
        display: grid;
        gap: 4px;
        font-size: 13px;
      }
      .desk-sec li::before {
        content: '▸ ';
        color: var(--muted);
      }

      /* ---------- record + standing orders ---------- */
      .page {
        padding-top: 24px;
        display: grid;
        gap: 20px;
      }
      .page h1 {
        font-size: 24px;
        font-weight: 650;
        letter-spacing: -0.3px;
      }
      .page .lede {
        color: var(--muted);
        max-width: 64ch;
        margin-top: 2px;
      }
      .filters {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
      }
      .filters input[type='search'] {
        flex: 1;
        min-width: 180px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        padding: 5px 10px;
        font-size: 13px;
      }
      .filters input:focus {
        outline: none;
        border-color: var(--accent);
      }
      .pill {
        font-size: 12.5px;
        padding: 3px 12px;
        border-radius: 14px;
        border: 1px solid var(--border);
        color: var(--muted);
      }
      .pill[aria-pressed='true'] {
        color: var(--text);
        border-color: var(--accent);
      }
      .rec-item {
        display: grid;
        grid-template-columns: 84px minmax(0, 1fr) auto;
        gap: 12px;
        padding: 12px 0;
        border-top: 1px solid var(--border);
        font-size: 13.5px;
      }
      .rec-item .when {
        color: var(--muted);
        font-size: 12px;
      }
      .rec-item .sub {
        display: block;
        color: var(--muted);
        font-size: 12.5px;
      }
      .group-label {
        padding-top: 8px;
      }
      .rule {
        display: grid;
        grid-template-columns: 36px minmax(0, 1fr) auto;
        gap: 12px;
        padding: 12px 0;
        border-top: 1px solid var(--border);
        align-items: start;
      }
      .rule .id {
        font-size: 12px;
        font-weight: 700;
        color: var(--accent);
      }
      .rule .sub {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        font-size: 12px;
        color: var(--muted);
        margin-top: 4px;
        align-items: center;
      }
      .setting {
        display: flex;
        gap: 16px;
        align-items: center;
        justify-content: space-between;
        padding: 12px 0;
        border-top: 1px solid var(--border);
      }
      .setting .sub {
        font-size: 12.5px;
        color: var(--muted);
        display: block;
      }
      select {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        padding: 4px 8px;
        font-size: 13px;
      }
      .stub {
        font-size: 12.5px;
        color: var(--muted);
        border: 1px dashed var(--border);
        border-radius: var(--radius-md);
        padding: 10px 14px;
      }

      /* first run */
      .firstrun {
        display: grid;
        gap: 12px;
        padding: 24px 0;
        max-width: 560px;
      }
      .repo {
        display: flex;
        gap: 10px;
        align-items: center;
        padding: 8px 12px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        font-size: 13px;
      }
      .repo .mono {
        color: var(--muted);
        margin-left: auto;
      }

      /* toast, help, prototype menu */
      .toast {
        position: fixed;
        left: 50%;
        bottom: 108px;
        transform: translateX(-50%);
        z-index: 20;
        background: var(--panel-raised);
        border: 1px solid var(--border-hover);
        border-radius: var(--radius-md);
        padding: 8px 8px 8px 16px;
        display: flex;
        gap: 12px;
        align-items: center;
        font-size: 13px;
        box-shadow: var(--shadow-md);
        max-width: min(560px, 92vw);
        animation: enter var(--dur-base) var(--ease) 1;
      }
      .overlay {
        position: fixed;
        inset: 0;
        z-index: 30;
        background: rgba(8, 5, 14, 0.66);
        display: grid;
        place-items: center;
      }
      .modal {
        background: var(--panel);
        border: 1px solid var(--border-hover);
        border-radius: var(--radius-lg);
        padding: 20px 24px;
        box-shadow: var(--shadow-lg);
        width: min(480px, 92vw);
      }
      .modal h2 {
        font-size: 16px;
        margin-bottom: 12px;
      }
      .keys {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 6px 16px;
        font-size: 13px;
      }
      .pmenu {
        position: absolute;
        top: calc(var(--topbar-h) - 4px);
        right: 16px;
        z-index: 25;
        width: 300px;
        background: var(--panel);
        border: 1px dashed var(--border-hover);
        border-radius: var(--radius-lg);
        padding: 14px 16px;
        box-shadow: var(--shadow-lg);
        display: grid;
        gap: 10px;
      }
      .pmenu label.opt-row {
        display: flex;
        gap: 8px;
        align-items: center;
        font-size: 13px;
        cursor: pointer;
      }
      .pmenu p {
        font-size: 12px;
        color: var(--muted);
      }

      /* ---------- responsive composition ---------- */
      @media (max-width: 1320px) {
        .drawer {
          box-shadow: var(--shadow-lg);
        }
      }
      @media (max-width: 1100px) {
        .zones,
        .cmdr-grid {
          grid-template-columns: minmax(0, 1fr);
        }
        .florina {
          grid-template-columns: 56px minmax(0, 1fr);
        }
        .florina .tools {
          grid-column: 2;
          flex-direction: row;
          align-items: center;
          flex-wrap: wrap;
        }
        .strip {
          grid-column: 2;
        }
        .florina h1 {
          font-size: 24px;
        }
      }
      @media (max-width: 860px) {
        :root {
          --drawer-w: 100vw;
        }
        .app {
          grid-template-columns: minmax(0, 1fr);
          grid-template-areas:
            'top'
            'rail'
            'main'
            'bar';
          grid-template-rows: var(--topbar-h) auto minmax(0, 1fr) auto;
        }
        .logo {
          width: auto;
        }
        .rail {
          border-right: 0;
          border-bottom: 1px solid var(--border);
        }
        .rail-head,
        .rail-foot {
          display: none;
        }
        .rail-list {
          display: flex;
          gap: 8px;
          overflow-x: auto;
          overflow-y: hidden;
          padding: 8px 12px;
        }
        .seat {
          flex: none;
          width: 276px;
        }
        .seat + .seat {
          margin-top: 0;
        }
        .stage {
          padding: 0 16px 16px;
        }
        .banner {
          margin: 12px 16px 0;
        }
        .sheet {
          left: 12px;
          right: 12px;
        }
        .topbar {
          gap: 12px;
          padding: 0 12px;
        }
        .daemon span:last-child {
          display: none;
        }
        .orderbar .hint .kbd-hint {
          display: none;
        }
      }
      @media (max-width: 520px) {
        .florina {
          grid-template-columns: minmax(0, 1fr);
        }
        .orb {
          width: 40px;
          height: 40px;
        }
        .florina .tools,
        .strip {
          grid-column: 1;
        }
        .dl {
          grid-template-columns: minmax(0, 1fr);
        }
        .rule,
        .rec-item {
          grid-template-columns: minmax(0, 1fr);
        }
        .tabs .tab {
          padding: 0 8px;
          font-size: 13px;
        }
        .proto-btn {
          display: none;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.001ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.001ms !important;
        }
      }
      .reduce-motion *,
      .reduce-motion *::before,
      .reduce-motion *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
      }
    </style>
  </head>
  <body>
    <div class="app" id="app">
      <header class="topbar">
        <div class="logo">Flor<em>ina</em></div>
        <nav class="tabs" aria-label="Destinations" id="tabs"></nav>
        <span class="spacer"></span>
        <div class="daemon" id="daemon"></div>
        <button class="proto-btn" id="protoBtn" aria-haspopup="dialog" aria-expanded="false">
          PROTOTYPE ▾
        </button>
      </header>

      <nav class="rail" aria-label="Commanders">
        <div class="rail-head">
          <div class="label">Commanders</div>
          <div class="hint">One per project. They handle local failures.</div>
        </div>
        <div class="rail-list" id="railList"></div>
        <div class="rail-foot">
          <button class="btn ghost" id="appointBtn" style="width: 100%">
            + Appoint a commander
          </button>
        </div>
      </nav>

      <main class="main" id="main" aria-label="The Table">
        <div id="banner"></div>
        <div class="stage" id="stage"></div>
        <div id="sheet"></div>
      </main>

      <aside id="drawer" hidden aria-label="Side panel"></aside>

      <form class="orderbar" id="orderForm" aria-label="Give an order">
        <div id="addr"></div>
        <div class="line">
          <button
            type="button"
            class="mic"
            id="mic"
            aria-pressed="false"
            aria-label="Talk to Florina. Hold Space, or click to start and stop."
          >
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <rect x="9" y="3" width="6" height="11" rx="3"></rect>
              <path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path>
            </svg>
          </button>
          <div class="field">
            <label for="order" class="sr">Give Florina an order</label>
            <textarea
              id="order"
              rows="1"
              placeholder="Tell Florina the outcome you want."
            ></textarea>
          </div>
          <button type="submit" class="btn primary" id="send" style="height: 44px">Send</button>
        </div>
        <div class="hint">
          <span><kbd>Hold Space</kbd> talk</span>
          <span><kbd>Enter</kbd> send · <kbd>Shift+Enter</kbd> new line</span>
          <span class="kbd-hint"><kbd>o</kbd> focus here · <kbd>?</kbd> all shortcuts</span>
        </div>
      </form>
    </div>

    <div id="toast" aria-hidden="true"></div>
    <div id="overlay"></div>
    <div id="pmenu"></div>
    <div class="sr" id="live" role="status" aria-live="polite"></div>

    <script>
      'use strict';

      /* ===================================================================
       * Helpers
       * =================================================================== */
      const $ = (s, r = document) => r.querySelector(s);
      const $$ = (s, r = document) => [...r.querySelectorAll(s)];
      const esc = (s) =>
        String(s).replace(
          /[&<>"']/g,
          (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c],
        );
      const pl = (n, w, p) => `${n} ${n === 1 ? w : p || w + 's'}`;
      const fmt = (m) =>
        `${String(Math.floor(m / 60) % 24).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}`;
      const URLQ = new URLSearchParams(location.search);

      /* ===================================================================
       * Fixtures — realistic content shaped like the real domain objects
       * (Task states, AttentionItem category/priority, Approval fields,
       * SupervisorEvent kinds). All numbers are invented prototype data.
       * =================================================================== */
      const STATUS = {
        awaiting: { word: 'Needs you', tone: 'amber' },
        critical: { word: 'Stopped itself', tone: 'red' },
        holding: { word: 'Holding', tone: 'amber' },
        advancing: { word: 'Advancing', tone: '' },
        verifying: { word: 'Verifying', tone: '' },
        briefed: { word: 'Briefed', tone: '' },
        paused: { word: 'Paused by you', tone: 'amber' },
        idle: { word: 'Standing by', tone: '' },
      };

      const ORDER_GLYPH = { verified: '✓', running: '●', blocked: '◐', queued: '○' };
      const ORDER_WORD = {
        verified: 'verified',
        running: 'in progress',
        blocked: 'waiting on you',
        queued: 'queued',
      };

      function mkRules() {
        return [
